<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Votify — Opinion Arena</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%236366F1'/><text x='32' y='44' font-family='Arial' font-size='36' font-weight='bold' fill='white' text-anchor='middle'>V</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
/* ============ 01: RESET & BASE ============ */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;border-radius:0!important}
body,input,select,button,div,span,p,h1,h2,h3,a,label{-webkit-user-select:none;user-select:none;-moz-user-select:none}
input,textarea{-webkit-user-select:text!important;user-select:text!important;-moz-user-select:text!important}
:root{--bubble:#0E9F6E;--gold:#FCD34D;--ok:#10B981;--bad:#F43F5E;--ink:#F4F5FB}
*{box-sizing:border-box}
body{margin:0;background:#06070D;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:radial-gradient(800px 600px at 12% 8%,rgba(99,102,241,.18),transparent 60%),radial-gradient(900px 700px at 88% 20%,rgba(168,85,247,.15),transparent 60%),radial-gradient(700px 500px at 50% 100%,rgba(59,130,246,.12),transparent 60%),linear-gradient(180deg,#04050A,#06070D)}
#theme-bg{position:fixed;inset:0;z-index:-2;display:none}
body.themed::before{display:none}
body.themed #theme-bg{display:block}
.font-display{font-family:'Sora',sans-serif}
::-webkit-scrollbar{width:9px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09)}
.clamp1{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trunc-wrap{min-width:0}

/* ============ 02: ERROR BANNER (bug-finder system) ============ */
#fatal-bar{position:fixed;top:0;left:0;right:0;z-index:9999;background:#7F1D1D;color:#FEE2E2;padding:12px 16px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;display:none;max-height:45vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,.6)}
#fatal-bar.show{display:block}
#fatal-bar .fb-title{font-weight:800;color:#FCA5A5;font-size:13px;margin-bottom:6px}
#fatal-bar button{float:right;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#FEE2E2;padding:4px 12px;cursor:pointer;font-weight:700;font-size:11px;margin-left:10px;font-family:inherit}

/* ============ 03: SURFACES ============ */
.glass{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px)}
.glass-strong{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(24px)}
.card-hover{transition:transform .3s,border-color .3s,box-shadow .3s}
.card-hover:hover{transform:translateY(-4px);border-color:rgba(129,140,248,.35);box-shadow:0 20px 50px -20px rgba(99,102,241,.35)}
.gradient-text{background:linear-gradient(135deg,#A5B4FC,#C4B5FD 35%,#F0ABFC 65%,#FCD34D);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:220% auto;animation:gradMove 5s ease infinite}
.gradient-brand{background:linear-gradient(135deg,#6366F1,#8B5CF6)}
.glow-brand{box-shadow:0 10px 40px -8px rgba(99,102,241,.6)}
.hero-blob{position:absolute;border-radius:50%!important;filter:blur(46px);opacity:.55;pointer-events:none;animation:a-floatDiag 7s ease-in-out infinite}
.hero-glow{position:absolute;right:-80px;top:-80px;width:320px;height:320px;background:radial-gradient(circle,rgba(139,92,246,.28),transparent 70%);pointer-events:none}

/* ============ 04: BUTTONS ============ */
.btn-primary{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;border:none;cursor:pointer;transition:.25s;box-shadow:0 8px 30px -8px rgba(99,102,241,.55);font-family:inherit}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;cursor:pointer;transition:.2s;font-family:inherit}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed}
.a-btn{padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;position:relative;overflow:hidden;font-family:inherit;transition:.2s}
.a-btn:hover{background:rgba(255,255,255,.12)}
.a-btn.danger{background:rgba(244,63,94,.15);border-color:rgba(244,63,94,.4);color:#FDA4AF}
.a-btn.gift{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.4);color:#FDE68A}
.a-btn.own{background:rgba(16,185,129,.18);border-color:rgba(16,185,129,.5);color:#6EE7B7}
.a-tab{padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;color:#8A8DA3;border:1px solid transparent;background:none;transition:.2s;font-family:inherit;position:relative;overflow:hidden}
.a-tab:hover{color:#fff}
.a-tab.active{color:#fff;background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4)}
.pill-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:#F4F5FB;cursor:pointer;transition:.2s;font-family:inherit;position:relative;overflow:hidden}
.pill-btn:hover{background:rgba(129,140,248,.18);border-color:rgba(129,140,248,.55);transform:translateY(-1px)}
.icobtn{width:36px;height:36px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:.2s;flex-shrink:0;position:relative;overflow:hidden;font-family:inherit}
.icobtn:hover{background:rgba(255,255,255,.14)}
.lb-btn{padding:11px 20px;font-weight:800;font-size:13.5px;cursor:pointer;color:#C7C9DE;border:1px solid rgba(129,140,248,.6);background:linear-gradient(110deg,rgba(99,102,241,.1) 30%,rgba(167,139,250,.4) 48%,rgba(244,114,182,.25) 52%,rgba(99,102,241,.1) 70%);background-size:220% 100%;animation:lbShine 2.4s linear infinite,lbGlow 2.4s ease-in-out infinite;transition:.25s;font-family:inherit;position:relative;overflow:hidden}
.lb-btn:hover{color:#fff;transform:translateY(-1px)}
.lb-btn.active{color:#fff;border-color:#A5B4FC}
.cbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:38px;padding:0 11px;font-size:11px;font-weight:800;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:.2s;font-family:inherit;position:relative;overflow:hidden}
.cbtn:hover{background:rgba(255,255,255,.14)}
.cbtn.wc-on{background:linear-gradient(135deg,#10B981,#06B6D4);border-color:rgba(16,185,129,.6)}
.cbtn.un-dot{position:relative}
.cbtn.un-dot::after{content:'';position:absolute;top:-2px;right:-2px;width:7px;height:7px;background:#F43F5E;border-radius:50%!important;animation:pulse 1.8s infinite}
.ripple-fx{position:absolute;border-radius:50%!important;background:rgba(255,255,255,.4);transform:scale(0);animation:rippleAnim .65s ease-out forwards;pointer-events:none}

/* ============ 05: INPUTS ============ */
input,textarea,select{font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none}
.input-field{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);padding:12px 14px;color:#fff;width:100%;font-size:14.5px;transition:.2s}
.input-field:focus{border-color:rgba(129,140,248,.5);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.input-field::placeholder{color:#5C5F77}
select option{background:#0A0B16;color:#F4F5FB}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:rgba(255,255,255,.4);margin:14px 0 6px}
.st-range{width:100%;accent-color:#818CF8;cursor:pointer}

/* ============ 06: BADGES & CHIPS ============ */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff}
.live-dot{width:8px;height:8px;background:#10B981;border-radius:50%!important;box-shadow:0 0 0 0 rgba(16,185,129,.7);animation:pulse 1.8s infinite;flex-shrink:0}
.uid-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:10.5px;font-weight:800;background:rgba(103,232,249,.08);border:1px solid rgba(103,232,249,.25);color:#67E8F9;font-family:'Sora'}
.golden-quote{font-style:italic;color:#FCD34D;font-weight:600}
.notif-badge,.dm-badge{position:absolute;top:-5px;right:-5px;min-width:24px;height:18px;font-size:11px;font-weight:800;padding:0 7px;display:none;align-items:center;justify-content:center;border:2px solid #0A0B14;white-space:nowrap}
.notif-badge{background:#F43F5E;color:#fff}
.dm-badge{background:#EC4899;color:#fff}
.dm-tab-badge{background:#EC4899;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;min-width:16px;text-align:center;display:none}
.own-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#10B981,#34D399);color:#04120A;padding:2px 9px;font-size:9px;font-weight:800;letter-spacing:.12em;margin-bottom:3px}
.ch-tag{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#2563EB,#1D4ED8);color:#DBEAFE;padding:2px 9px;font-size:9px;font-weight:800;letter-spacing:.12em;margin-bottom:3px}
.nd-red{width:9px;height:9px;background:#F43F5E;border-radius:50%!important;display:inline-block;flex-shrink:0;box-shadow:0 0 8px rgba(244,63,94,.8)}

/* ============ 07: TOAST ============ */
#toasts{position:fixed;top:16px;right:16px;z-index:400;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;position:relative;overflow:hidden;min-width:250px;max-width:360px;padding:12px 16px;background:rgba(12,14,26,.94);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);display:flex;align-items:center;gap:12px;animation:toastIn .35s cubic-bezier(.22,1,.36,1) both}
.toast.out{transition:all .3s;opacity:0;transform:translateX(40px)}
.toast .t-ico{width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:tickPop .5s cubic-bezier(.34,1.56,.64,1)}
.toast .t-msg{font-size:13.5px;font-weight:600;color:#fff;flex:1;word-break:break-word}
.toast .t-bar{position:absolute;left:0;bottom:0;height:3px;width:100%;animation:toastBarAnim 3.4s linear forwards}

/* ============ 08: MODALS ============ */
.modal-overlay{position:fixed;inset:0;z-index:210;background:rgba(4,5,10,.8);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;animation:scaleIn .25s ease both;overflow-y:auto}
.modal-card{width:100%;max-width:420px;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,#0A0B16,#06070D);border:1px solid rgba(129,140,248,.3);padding:22px}
.center-modal{position:fixed;inset:0;z-index:230;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;animation:scaleIn .25s ease both;backdrop-filter:blur(8px);overflow-y:auto}
.center-card{width:100%;max-width:430px;max-height:86vh;overflow-y:auto;background:#0B1F1A;border:1px solid rgba(16,185,129,.4);padding:20px;box-shadow:0 30px 90px -20px rgba(0,0,0,.9)}

/* ============ 09: WELCOME SPLASH ============ */
#welcome{position:fixed;inset:0;z-index:500;background:radial-gradient(700px 500px at 30% 20%,rgba(99,102,241,.25),transparent 60%),radial-gradient(700px 500px at 70% 80%,rgba(168,85,247,.22),transparent 60%),linear-gradient(180deg,#04050A,#07080F);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .7s ease,visibility .7s;cursor:pointer}
#welcome.hide{opacity:0;visibility:hidden}
.w-logo{width:96px;height:96px;background:linear-gradient(135deg,#4F46E5,#7C3AED 50%,#A855F7);display:flex;align-items:center;justify-content:center;animation:wPop .9s cubic-bezier(.34,1.56,.64,1) both,wGlow 2.2s ease-in-out infinite}
.w-title{font-family:'Sora';font-weight:800;font-size:46px;animation:wUp .7s .35s ease both}
.w-sub{font-size:11px;letter-spacing:.5em;color:rgba(255,255,255,.45);font-weight:800;animation:wUp .7s .55s ease both}
.w-quote{font-style:italic;color:#FCD34D;font-weight:600;font-size:14px;animation:wUp .7s .75s ease both}
.w-bar{height:3px;width:200px;background:linear-gradient(90deg,#6366F1,#A855F7,#F0ABFC);animation:wBar 1.4s .5s cubic-bezier(.22,1,.36,1) both}
.w-dots{display:flex;gap:6px;animation:wUp .6s .9s ease both}
.w-dots span{width:8px;height:8px;background:#818CF8;animation:wLetter 1.2s infinite}
.w-dots span:nth-child(2){animation-delay:.2s;background:#A855F7}
.w-dots span:nth-child(3){animation-delay:.4s;background:#F0ABFC}

/* ============ 10: AUTH ============ */
.auth-screen{position:fixed;inset:0;z-index:200;background:#05060D;animation:fadeUp .4s;display:flex;overflow:hidden}
.auth-inner{width:100%;height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-form-side{display:flex;align-items:center;justify-content:center;padding:40px;height:100%;box-sizing:border-box;order:1;overflow-y:auto}
.auth-card{width:100%;max-width:420px;background:rgba(12,14,26,.9);backdrop-filter:blur(30px);border:1px solid rgba(236,72,153,.4);padding:36px;box-shadow:0 0 60px rgba(236,72,153,.2),inset 0 0 30px rgba(236,72,153,.05);position:relative;overflow:hidden}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#EC4899,#A855F7,#6366F1)}
.auth-head{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.auth-icon{width:52px;height:52px;background:linear-gradient(135deg,#EC4899,#A855F7);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(236,72,153,.5);flex-shrink:0}
.auth-tabs{display:flex;background:rgba(255,255,255,.04);padding:5px;margin-bottom:28px;gap:5px;border:1px solid rgba(255,255,255,.05)}
.auth-tabs button{flex:1;padding:11px;border:none;background:none;color:rgba(255,255,255,.5);font-weight:700;font-size:13.5px;cursor:pointer;transition:.2s;font-family:inherit}
.auth-tabs button.active{color:#fff;background:linear-gradient(135deg,#6366F1,#8B5CF6);box-shadow:0 4px 12px rgba(99,102,241,.4)}
.auth-fields{display:flex;flex-direction:column;gap:18px}
.field-wrap{position:relative}
.field-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);pointer-events:none;display:flex;align-items:center}
.auth-input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);padding:0 16px 0 46px;color:#fff;font-size:14.5px;transition:.2s;height:52px;box-sizing:border-box}
.auth-input:focus{border-color:#EC4899;box-shadow:0 0 0 4px rgba(236,72,153,.15);outline:none}
.pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);cursor:pointer;background:none;border:none;padding:8px;display:flex;align-items:center}
.remember-check{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.6);cursor:pointer}
.remember-check input{accent-color:#6366F1;width:16px;height:16px;cursor:pointer}
.auth-hero{position:relative;padding:50px;display:flex;flex-direction:column;justify-content:flex-start;gap:30px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.06);height:100%;box-sizing:border-box;order:2}
.hglow{position:absolute;filter:blur(100px);pointer-events:none}
.hg1{width:500px;height:500px;background:rgba(124,58,237,.5);top:-150px;left:-120px}
.hg2{width:440px;height:440px;background:rgba(6,182,212,.4);top:30%;right:-130px}
.hg3{width:380px;height:380px;background:rgba(245,158,11,.2);bottom:-140px;left:30%}
.auth-hero>*{position:relative;z-index:2}
.stat3{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);min-width:130px}
.stat3 b{font-family:'Sora';font-size:22px;display:block;line-height:1.1}
.stat3 span{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.feat-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);padding:16px}
@media(max-width:900px){.auth-inner{grid-template-columns:1fr;height:auto;min-height:100vh}.auth-hero{display:none}.auth-form-side{padding:16px;height:auto;min-height:100vh;align-items:center}.auth-card{padding:24px}}

/* ============ 11: TOPBAR & DRAWER ============ */
.mobile-topbar{display:flex;position:fixed;top:0;left:0;right:0;height:60px;z-index:60;align-items:center;gap:8px;padding:0 12px;background:rgba(6,7,13,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.07)}
.top-clock-box{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);padding:5px 11px;margin-left:auto;margin-right:10px;flex-shrink:0;text-align:center}
#tc-time{font-family:'Sora';font-weight:800;font-size:12px;line-height:1.1}
#tc-date{font-size:8.5px;font-weight:700;line-height:1.1;margin-top:2px;color:#94A3B8;text-transform:uppercase}
.drawer-back{position:fixed;inset:0;z-index:110;background:rgba(4,5,10,.65);opacity:0;pointer-events:none;transition:.25s}
.drawer-back.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:272px;z-index:120;background:linear-gradient(180deg,#0A0B16,#06070D);border-right:1px solid rgba(255,255,255,.08);transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column;padding:16px;overflow-y:auto}
.drawer.open{transform:none}
.nav-link{display:flex;align-items:center;gap:14px;padding:11px 14px;color:#B4B7CB;font-weight:500;font-size:14.5px;cursor:pointer;transition:.2s;position:relative;overflow:hidden;margin-bottom:2px}
.nav-link:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav-link.active{color:#fff;background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(168,85,247,.12));border:1px solid rgba(129,140,248,.25)}
.drawer-tools{margin-top:6px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.dt-hub{display:block;width:calc(100% - 12px);margin:8px 6px 0;padding:10px 12px 10px 14px;font-family:'Sora';font-weight:800;font-size:12.5px;color:#fff;background:linear-gradient(135deg,#EF4444,#DC2626);border:1px solid rgba(255,255,255,.4);border-left:5px solid #FCA5A5;cursor:pointer;text-align:left;position:relative;overflow:hidden;transition:.2s}
.dt-hub:hover{transform:translateY(-1px)}
.dt-hub.games{background:linear-gradient(135deg,#6366F1,#EC4899);border-left-color:#C4B5FD}
.dt-notif-dot{position:absolute;top:4px;right:8px;width:10px;height:10px;background:#F43F5E;border-radius:50%!important;border:2px solid #0A0B16;box-shadow:0 0 8px rgba(244,63,94,.8);animation:a-blink 1.2s infinite}
.main-content{margin-left:0;padding:74px 30px 70px;max-width:1440px;margin:0 auto}
.view-anim{animation:viewIn .45s cubic-bezier(.22,1,.36,1) both}
.imp-bar{position:fixed;bottom:0;left:0;right:0;z-index:400;background:linear-gradient(90deg,#7C3AED,#DB2777);padding:9px 14px;display:flex;align-items:center;gap:10px}

/* ============ 12: STATS / EMPTY / SKELETON ============ */
.stat-tile{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);padding:12px;text-align:center;position:relative;overflow:hidden}
.stat-tile b{font-family:'Sora';font-size:19px;display:block;line-height:1.2}
.stat-tile span{font-size:9.5px;color:rgba(255,255,255,.4);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat-tile.clickable{cursor:pointer;transition:.2s}
.stat-tile.clickable:hover{border-color:rgba(129,140,248,.55);transform:translateY(-2px)}
.empty-state{text-align:center;padding:48px 16px}
.empty-state .e-ic{width:64px;height:64px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}

/* ---------- 2.6 DOM & FORMAT HELPERS ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(n){n=Number(n)||0;if(n>=1e15)return(n/1e15).toFixed(2).replace(/\.00$/,'')+'Q';if(n>=1e12)return(n/1e12).toFixed(2).replace(/\.00$/,'')+'T';if(n>=1e9)return(n/1e9).toFixed(2).replace(/\.00$/,'')+'B';if(n>=1e6)return(n/1e6).toFixed(2).replace(/\.00$/,'')+'M';if(n>=1e3)return(n/1e3).toFixed(1).replace(/\.0$/,'')+'k';return String(n);}
function fmtDur(sec){sec=Math.max(0,Math.floor(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);if(h)return h+'h '+m+'m';if(m)return m+'m';return sec+'s';}
function fmtMB(b){return(b/1048576).toFixed(1)+'MB';}
function fmtTime(ts){if(!ts)return'';const d=Math.floor((Date.now()-ts)/1e3);if(d<60)return'just now';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';return Math.floor(d/86400)+'d ago';}
function fmtDate(ts){if(!ts)return'—';try{return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return'—';}}
function fmtDay(ts){if(!ts)return'';try{return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return'';}}
function fmtClock(ts){if(!ts)return'';try{return new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}catch(e){return'';}}
function timeLeft(t){let d=Math.max(0,(t||0)-Date.now())/1e3;if(d<=0)return'Ended';const dy=Math.floor(d/86400),h=Math.floor(d%86400/3600),m=Math.floor(d%3600/60);if(dy>0)return dy+'d '+h+'h left';if(h>0)return h+'h '+m+'m left';return Math.max(0,m)+'m left';}
const localKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>new Date().toDateString();
function userCode(uid){if(!uid)return'VOT-000000';const s=String(uid).replace(/[^a-zA-Z0-9]/g,'').toUpperCase();let h=0;for(let i=0;i<s.length;i++)h=((h*31)+s.charCodeAt(i))>>>0;return'VOT-'+h.toString(36).toUpperCase().padStart(6,'0').slice(-6);}
const uidChip=uid=>`<span class="uid-chip"><i data-lucide="fingerprint" class="w-3 h-3"></i>${userCode(uid)}</span>`;

/* ---------- 2.7 LEVEL SYSTEM ---------- */
function getLevelData(xp){xp=Math.max(0,Number(xp)||0);const currentLvl=Math.min(MAX_LEVEL,Math.floor(Math.sqrt(xp/50))+1);const prevReq=Math.pow(currentLvl-1,2)*50,nextReq=Math.pow(currentLvl,2)*50,isMax=currentLvl>=MAX_LEVEL;const progress=isMax?100:((xp-prevReq)/Math.max(1,nextReq-prevReq))*100;return{currentLvl,prevReq,nextReq,progress:Math.max(0,Math.min(100,progress)),xpToNext:isMax?0:nextReq-xp,isMax};}
const levelOf=xp=>getLevelData(xp).currentLvl;

/* ---------- 2.8 COOKIE / SESSION ---------- */
function setCookie(k,v,days){try{const d=new Date();d.setTime(d.getTime()+days*864e5);document.cookie=k+'='+encodeURIComponent(v)+';expires='+d.toUTCString()+';path=/';}catch(e){}}
function getCookie(k){try{const m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));return m?decodeURIComponent(m[1]):null;}catch(e){return null;}}
function delCookie(k){try{document.cookie=k+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';}catch(e){}}
function saveSession(email,uid,remember){const d=JSON.stringify({email,uid});try{localStorage.removeItem('basiler_session');sessionStorage.removeItem('basiler_session');}catch(x){}
if(remember===false){try{sessionStorage.setItem('basiler_session',d);}catch(x){}}
else{try{localStorage.setItem('basiler_session',d);}catch(x){}setCookie('basiler_session',d,365);}}
function loadSession(){try{const l=localStorage.getItem('basiler_session');if(l)return JSON.parse(l);}catch(e){}
const c=getCookie('basiler_session');if(c){try{return JSON.parse(c);}catch(e){}}
try{const s=sessionStorage.getItem('basiler_session');if(s)return JSON.parse(s);}catch(e){}
return null;}

function compressImage(file,maxDim,q){return new Promise((res,rej)=>{if(!file)return rej(new Error('nofile'));const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{try{const md=maxDim||800,qq=q||.6;const sc=Math.min(1,md/(img.width||md));const cv=document.createElement('canvas');cv.width=Math.max(2,Math.round(img.width*sc));cv.height=Math.max(2,Math.round(img.height*sc));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',qq));}catch(x){rej(x);}};img.onerror=()=>rej(new Error('bad'));img.src=e.target.result;};r.onerror=()=>rej(new Error('read'));r.readAsDataURL(file);});}

function emailKey(e){let h=0;const s=String(e).toLowerCase().trim();for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return'e'+(h>>>0).toString(36);}

function hashPin(p){let h=0;const s=String(p);for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return'pin'+(h>>>0).toString(36);}

function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase();}
function mixHex(a,b){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex((A.r+B.r)/2,(A.g+B.g)/2,(A.b+B.b)/2);}

const total=counts.reduce((a,c)=>a+c,0);
if(b.creator===uid){created++;votesReceived+=total;}
const mv=opts.findIndex(o=>(o.votes||{})[uid]);
if(mv>=0){
participated++;
if(Date.now()>(b.endsAt||0)&&total>0){
const mx=Math.max(...counts);
if(counts.filter(c=>c===mx).length===1&&mv===counts.indexOf(mx))won++;else lost++;
}
}
}
for(const r of Object.values(archivedResults)){
if(r&&r.creator===uid){created++;votesReceived+=(r.total||0);}
}
return{created,won,lost,participated,votesReceived};}

/* ---------- 4.5 AI IMAGE ANALYZER ---------- */
function analyzeImage(src){
return new Promise(res=>{
if(!src)return res({ok:false});
const img=new Image();
img.crossOrigin='anonymous';
img.onload=()=>{
try{
if(!img.width||!img.height)return res({ok:false});
const S=56,sc=Math.min(1,S/Math.max(img.width,img.height));
const w=Math.max(2,Math.round(img.width*sc)),h=Math.max(2,Math.round(img.height*sc));
const cv=document.createElement('canvas');cv.width=w;cv.height=h;
const ctx=cv.getContext('2d');
ctx.drawImage(img,0,0,w,h);
const d=ctx.getImageData(0,0,w,h).data;
let lum=0,sat=0;const n=w*h,lums=new Array(n);
for(let i=0;i<n;i++){
const j=i*4,r=d[j],g=d[j+1],b2=d[j+2],l=.299*r+.587*g+.114*b2;
lums[i]=l;lum+=l;
const mx=Math.max(r,g,b2),mn=Math.min(r,g,b2);
sat+=mx===0?0:(mx-mn)/mx;
}
lum/=n;sat/=n;
let vr=0;
for(let i=0;i<n;i++)vr+=(lums[i]-lum)*(lums[i]-lum);
const std=Math.sqrt(vr/n);
let edges=0;
for(let y=1;y<h;y++)for(let x=1;x<w;x++){
const i2=(y*w+x)*4;
const lc=.299*d[i2-4]+.587*d[i2-3]+.114*d[i2-2];
const lb=.299*d[i2-w*4]+.587*d[i2-w*4+1]+.114*d[i2-w*4+2];
if(Math.abs(lc-lb)>18)edges++;
}
res({ok:true,brightness:lum/255,saturation:sat,contrast:std/128,detail:Math.min(1,edges/Math.max(1,(w-1)*(h-1))*3)});
}catch(e){res({ok:false});}
};
img.onerror=()=>res({ok:false});
img.src=src;});}

const an=[];
for(const o of opts)an.push(await analyzeImage(o.img||''));
const scores=opts.map((o,i)=>{
const a=an[i];
if(a&&a.ok)return{label:o.label,real:true,b:Math.round(a.brightness*100),s:Math.round(a.saturation*100),c:Math.round(Math.min(100,a.contrast*100)),d:Math.round(a.detail*100),score:Math.round(Math.min(100,Math.max(6,a.brightness*30+a.saturation*25+a.contrast*25+a.detail*25+6)))};

 ${bar('☀ Bright',scores[i].b)}${bar('🎨 Color',scores[i].s)}${bar('◐ Contrast',scores[i].c)}${bar('🔍 Detail',scores[i].d)}
</div>`).join('')}
<div class="glass-strong p-4 text-center" style="border-color:rgba(6,182,212,.4)">

/* ---------- 4.7 VOTE SYSTEM ---------- */
async function vote(bid,oi){
const b=allBattles[bid];
if(!b)return;
if(Date.now()>(b.endsAt||0))return toast('Battle has ended','warning');
if(bannedUsers.has(MY.uid))return toast('You are banned','error');
const opts=b.options||[];
const prev=opts.findIndex(o=>(o.votes||{})[MY.uid]);
if(prev===oi)return toast('Already voted this option','warning');
const u={};
if(prev>=0){
u['battles/'+bid+'/options/'+prev+'/votes/'+MY.uid]=null;
}else{
const today=todayStr(),last=MY.lastVoteDay||'';
let streak=MY.streakDays||0;
if(last!==today){const y=new Date(Date.now()-864e5).toDateString();streak=(last===y)?streak+1:1;}
const old=MY.xp||0;
u['users/'+MY.uid+'/xp']=old+20;
u['users/'+MY.uid+'/votesCount']=(MY.votesCount||0)+1;
u['users/'+MY.uid+'/streakDays']=streak;
u['users/'+MY.uid+'/lastVoteDay']=today;
if(b.creator&&b.creator!==MY.uid)pushNotif(b.creator,'vote',`${MY.name} voted on your battle`,{bid});
checkLevelUp(old,old+20);
beep();
incDaily('vote');
}
u['battles/'+bid+'/options/'+oi+'/votes/'+MY.uid]=Date.now();
try{
await db.ref().update(u);
if(prev>=0)toast('Vote changed! ✅','success');else flyXP('+20 XP ⚡');
if(prev<0&&navigator.vibrate)navigator.vibrate(70);
const cont=document.getElementById('battle-opts');
if(cont){cont.classList.remove('shake-anim');void cont.offsetWidth;cont.classList.add('shake-anim');}
}catch(e){showFirebaseError(e);}}

 ${vh?`<div class="flex items-center gap-2 mt-3"><span class="text-[11px] text-white/40 font-bold">Recent voters:</span><div class="flex gap-1.5">${vh}</div></div>`:''}

}

const a=p[0].trim(),b=p[1].trim();
return[{title:`${a} vs ${b} — Which one wins?`,cat:'memes',opts:[a,b],tags:['debate']},{title:`Team ${a} or Team ${b}?`,cat:'memes',opts:[a,b],tags:['teams']},{title:`${a} vs ${b} — Final Verdict`,cat:'memes',opts:[a,b],tags:['verdict']}];

/* ---------- 4.14 LIVE COUNTDOWN + EXPIRED CLEANUP ---------- */
function startLiveCountdown(endAt){
stopLiveCountdown();

const el=document.getElementById('live-cd');
if(!el)return stopLiveCountdown();
let d=Math.max(0,endAt-Date.now());
if(d<=0){el.innerHTML='<b style="color:#F43F5E;font-family:Sora">⏱ Ended</b>';return stopLiveCountdown();}
const dy=Math.floor(d/864e5),h=Math.floor(d%864e5/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);
el.innerHTML=(dy>0?`<div class="cd-seg"><b>${dy}</b><span>DAYS</span></div>`:'')+`<div class="cd-seg"><b>${String(h).padStart(2,'0')}</b><span>HRS</span></div><div class="cd-seg"><b>${String(m).padStart(2,'0')}</b><span>MIN</span></div><div class="cd-seg" style="border-color:rgba(244,63,94,.5)"><b style="color:#F43F5E">${String(s).padStart(2,'0')}</b><span>SEC</span></div>`;};
tick();
cdTimer=setInterval(tick,1000);}

function stopLiveCountdown(){if(cdTimer){clearInterval(cdTimer);cdTimer=null;}}

async function createTournament(){

async function checkTournaments(){
if(!MY)return;
for(const[id,t]of Object.entries(allTournaments)){
if(!t||t.status!=='active')continue;
const ms=t.matches&&t.matches[t.round];
if(!ms)continue;
const ids=Object.values(ms);
if(ids.length<2)continue;
const battles=ids.map(b=>allBattles[b]);
if(battles.some(b=>!b)||battles.some(b=>Date.now()<=(b.endsAt||0)))continue;
const winners=battles.map(b=>{
const o=b.options||[],c=o.map(x=>Object.keys(x.votes||{}).length),tot=c.reduce((a,x)=>a+x,0);
if(!tot)return null;
const mx=Math.max(...c);
return c.filter(x=>x===mx).length===1?o[c.indexOf(mx)].label:null;
});
if(winners.some(w=>!w)){
for(let i=0;i<battles.length;i++){
if(!winners[i]){try{await db.ref('battles/'+ids[i]+'/endsAt').set(Date.now()+216e5);}catch(e){}}
}
continue;
}
if(winners.length===1){
try{
await db.ref('tournaments/'+id).update({status:'finished',winner:winners[0]});
if(t.creator&&t.creator!==MY.uid)pushNotif(t.creator,'tournament','🏆 Your tournament "'+t.name+'" finished! Winner: '+winners[0],{});
}catch(e){}
continue;
}
const no=winners.map(w=>({label:w})),nids={};
for(let i=0;i<no.length;i+=2){
try{
const bref=await db.ref('battles').push({title:t.name+' — R'+(t.round+1)+': '+no[i].label+' vs '+no[i+1].label,category:t.category,creator:t.creator,creatorName:t.creatorName,createdAt:Date.now(),endsAt:Date.now()+864e5,tournament:id,round:t.round+1,match:i/2,options:[{label:no[i].label,img:'',votes:{}},{label:no[i+1].label,img:'',votes:{}}]});
nids[i/2]=bref.key;
}catch(e){}
}
try{
await db.ref('tournaments/'+id+'/matches/'+(t.round+1)).set(nids);
await db.ref('tournaments/'+id+'/round').set(t.round+1);
toast('🥇 Tournament "'+t.name+'" — Round '+(t.round+1)+' started!','success');
}catch(e){}
}}

async function pickUploadAv(inp){
const f=inp.files&&inp.files[0];
if(!f)return;
if(f.size>AV_MAX_MB*1048576)return toast('Image too big (max '+AV_MAX_MB+'MB)','warning');
try{
const d=await compressImage(f,300,.8);
window._pfAv=d;
const prev=document.getElementById('pf-av-prev');
if(prev)prev.src=d;
toast('Avatar ready — Save Profile','info');
}catch(e){toast('Could not load image','error');}}

function renderPfAvatars(){
const el=document.getElementById('pf-avatars');

el.innerHTML=list.map(a=>`<img src="${a}" data-av="${a}" class="av-pick ${MY.avatar===a?'border-indigo-500':''}" onclick="pickPfAv(this)">`).join('');

if(b)b.className='a-tab '+(avTab==='boys'?'active':'');
if(g)g.className='a-tab '+(avTab==='girls'?'active':'');}

 $$('#pf-avatars img').forEach(x=>{x.style.borderColor='transparent';});

gender:(document.getElementById('pf-gender')||{}).value||'',

async function pickPostImg(inp){
const f=inp.files&&inp.files[0];
if(!f)return;
if(f.size>CHAT_IMG_MAX_MB*1048576)return toast('Image too big (max '+CHAT_IMG_MAX_MB+'MB)','warning');
try{
const d=await compressImage(f,700,.65);
window._postImg=d;
const pv=document.getElementById('pt-img-prev');
if(pv)pv.innerHTML=`<div class="glass p-2 flex items-center gap-2"><img src="${d}" class="w-14 h-14 object-cover"><span class="text-[12px] text-white/60 flex-1">Image ready</span><button class="a-btn danger" onclick="window._postImg=null;document.getElementById('pt-img-prev').innerHTML=''">Remove</button></div>`;
}catch(e){toast('Could not load image','error');}}

async function createPost(){
const text=((document.getElementById('pt-text')||{}).value||'').trim();
const img=window._postImg;
const q=((document.getElementById('pt-q')||{}).value||'').trim();
const opts=[0,1,2,3].map(i=>((document.getElementById('pt-o'+i)||{}).value||'').trim()).filter(Boolean);
if(!text&&!img&&!q)return toast('Write something or add image/poll','warning');
if(q&&opts.length<2)return toast('Poll needs at least 2 options','warning');
const p={uid:MY.uid,name:MY.name,avatar:MY.avatar,ts:Date.now(),likes:{}};
if(text)p.text=text;
if(img)p.img=img;
if(q&&opts.length>=2)p.poll={q,opts:opts.map(l=>({label:l,votes:{}}))};
try{
await db.ref('posts').push(p);
await db.ref('users/'+MY.uid).update({postsCount:(MY.postsCount||0)+1});
incDaily('post');
window._postImg=null;
closeModal();
toast('Post created! 🚀','success');
}catch(e){showFirebaseError(e);}}

async function delPost(id){
if(!confirm('Delete this post?'))return;
try{
const p=allPosts.find(x=>x.id===id);
await db.ref('posts/'+id).remove();
if(p&&p.uid===MY.uid)await db.ref('users/'+MY.uid).update({postsCount:Math.max(0,(MY.postsCount||1)-1)});
toast('Post deleted','info');
}catch(e){}}

async function reactPost(id,emo){
const p=allPosts.find(x=>x.id===id);
if(!p)return;
const mine=(p.likes||{})[MY.uid];
const ref=db.ref('posts/'+id+'/likes/'+MY.uid);
try{
if(mine===emo)await ref.remove();
else{
await ref.set(emo);
if(!mine&&p.uid!==MY.uid)pushNotif(p.uid,'react',MY.name+' reacted '+emo+' to your post',{});
incDaily('react');
}
}catch(e){}}

async function votePostPoll(id,oi){
const p=allPosts.find(x=>x.id===id);
if(!p||!p.poll)return;
const opts=p.poll.opts||[];
if(oi<0||oi>=opts.length)return;
const prev=opts.findIndex(o=>(o.votes||{})[MY.uid]);
if(prev===oi)return toast('You already voted this option','warning');
const u={};
if(prev>=0)u['posts/'+id+'/poll/opts/'+prev+'/votes/'+MY.uid]=null;
u['posts/'+id+'/poll/opts/'+oi+'/votes/'+MY.uid]=Date.now();
try{
await db.ref().update(u);
if(prev<0){incDaily('vote');beep();toast('Poll vote cast! ✅','success');}
}catch(e){}}

let pollHTML='';

const opts=p.poll.opts||[],tot=opts.reduce((a,o)=>a+Object.keys(o.votes||{}).length,0),my=opts.findIndex(o=>(o.votes||{})[MY.uid]);
pollHTML=`<div class="glass p-3 mt-3">
<div class="font-bold text-[14px] mb-2">📊 ${esc(p.poll.q)}</div>
 ${opts.map((o,i)=>{
const c=Object.keys(o.votes||{}).length,pct=tot?Math.round(c/tot*100):0;
return `<div class="poll-bar" style="border-color:${my===i?'rgba(99,102,241,.6)':'rgba(255,255,255,.12)'}" onclick="votePostPoll('${p.id}',${i})">

 ${!mine?`<button class="a-btn ${myFollowing.has(p.uid)?'':'gift'}" style="padding:4px 10px;font-size:11px" onclick="toggleFollow('${p.uid}')">${myFollowing.has(p.uid)?'✓ Following':'➕ Follow'}</button>`:''}
 ${mine?`<button class="a-btn danger" style="padding:4px 10px;font-size:11px" onclick="delPost('${p.id}')">🗑</button>`:''}
</div>
 ${p.text?`<div class="text-[14px] text-white/85 whitespace-pre-wrap mt-2.5">${esc(p.text)}</div>`:''}
 ${p.img?`<img src="${p.img}" class="w-full mt-2.5 cursor-pointer" style="max-height:320px;object-fit:cover" onclick="viewImg(this.src)">`:''}

<div class="flex items-center gap-1.5 mt-3 flex-wrap">

<span class="text-[10.5px] text-white/30" style="margin-left:auto">${fmtTime(p.ts)}</span>
</div></div>`;}

async function sendChat(){
if(bannedUsers.has(MY.uid))return toast('You are banned','error');
if(chatMode==='dm'&&dmTarget&&blockedUsers.has(dmTarget.uid))return toast('Unblock this user first','warning');
const inp=document.getElementById('chat-inp');
const text=inp?inp.value.trim():'';
if(!text&&!pendingImage&&!pendingVoice)return;
const cid='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const msg={uid:MY.uid,name:MY.name,avatar:MY.avatar,ts:Date.now(),cid};
if(isAdmin)msg.owner=true;
if(text)msg.text=text;
if(pendingImage){msg.img=pendingImage;pendingImage=null;const p=document.getElementById('ci-prev');if(p)p.innerHTML='';}
if(pendingVoice){msg.voice=pendingVoice.src;msg.voiceDur=pendingVoice.dur;pendingVoice=null;const p=document.getElementById('ci-prev');if(p)p.innerHTML='';}
if(replyTo){msg.reply={name:replyTo.name,text:String(replyTo.text||'[media]').slice(0,80)};replyTo=null;const r=document.getElementById('reply-bar');if(r)r.innerHTML='';}
if(inp)inp.value='';
const tmpId='tmp'+Date.now()+Math.random().toString(36).slice(2,5);
chatMsgs.push({id:tmpId,pending:true,localTs:Date.now(),...msg});
renderChatMsgs();
scrollChat(true);
try{db.ref(typingPath+'/'+MY.uid).remove();}catch(e){}
incDaily('chat');
try{
const pushed=await db.ref(chatPath()).push(msg);
pendingKeys[tmpId]=pushed.key;
const ti=chatMsgs.findIndex(m=>m.id===tmpId);
if(ti>=0&&chatMsgs.some(m=>m.cid===cid&&m.id!==tmpId)){chatMsgs.splice(ti,1);renderChatMsgs();}
if(chatMode==='dm'&&dmTarget){
db.ref('dms/'+MY.uid+'/'+dmTarget.uid).set({name:dmTarget.name,avatar:dmTarget.avatar,ts:Date.now()});
db.ref('dms/'+dmTarget.uid+'/'+MY.uid).set({name:MY.name,avatar:MY.avatar,ts:Date.now()});
pushNotif(dmTarget.uid,'dm',MY.name+' sent you a message',isAdmin?{owner:true}:null);
}
}catch(e){
chatMsgs=chatMsgs.filter(m=>m.id!==tmpId);
renderChatMsgs();
toast('Message failed — check connection','error');}}

function voiceHTML(m){

<button class="voice-play" onclick="playVoice(this,'${m.id}')">▶</button>
<div class="voice-wave">${Array.from({length:22},(_,i)=>`<i style="height:${6+((i*13+(m.ts||0))%16)}px"></i>`).join('')}</div>
<span class="text-[10.5px]" style="opacity:.75">${fmtDur(m.voiceDur||0)}</span>

function playVoice(btn,id){
const m=chatMsgs.find(x=>x.id===id);
if(!m||!m.voice)return;
const wave=btn.parentElement?btn.parentElement.querySelector('.voice-wave'):null;
if(window._va){
window._va.pause();
if(_lastVoiceBtn){
_lastVoiceBtn.textContent='▶';
const lw=_lastVoiceBtn.parentElement?_lastVoiceBtn.parentElement.querySelector('.voice-wave'):null;
if(lw)lw.classList.remove('playing');
}}
if(window._va&&window._va._bid===id){window._va._bid=null;_lastVoiceBtn=null;window._va=null;return;}
const a=new Audio(m.voice);
a._bid=id;
window._va=a;
_lastVoiceBtn=btn;
btn.textContent='⏸';
if(wave)wave.classList.add('playing');
a.onended=()=>{btn.textContent='▶';if(wave)wave.classList.remove('playing');if(window._va===a)window._va=null;};
a.onpause=()=>{btn.textContent='▶';if(wave)wave.classList.remove('playing');};
a.play().catch(()=>{btn.textContent='▶';if(wave)wave.classList.remove('playing');toast('Cannot play voice','error');});}

async function toggleVoiceRec(){
if(voiceRecording){stopVoiceRec();return;}
if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Voice recording not supported','error');
try{
voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});
voiceChunks=[];voiceDiscard=false;
mediaRecorder=new MediaRecorder(voiceStream);
mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)voiceChunks.push(e.data);};
mediaRecorder.onstop=finishVoice;
mediaRecorder.start();
voiceRecording=true;voiceSecs=0;
voiceTimer=setInterval(()=>{
voiceSecs++;
const el=document.getElementById('voice-rec-ui');
if(el)el.textContent='🔴 '+fmtDur(voiceSecs)+' — tap ⏹ Send';
if(voiceSecs>=60)stopVoiceRec();
},1000);
renderVoiceUI();
}catch(e){toast('Mic permission denied','error');}}

function stopVoiceRec(){
if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();}

function cancelVoice(){
voiceDiscard=true;
stopVoiceRec();}

function finishVoice(){
voiceRecording=false;
clearInterval(voiceTimer);
const blob=new Blob(voiceChunks,{type:'audio/webm'});
if(voiceStream){voiceStream.getTracks().forEach(t=>t.stop());voiceStream=null;}
if(voiceDiscard){voiceDiscard=false;renderVoiceUI();return;}
if(!blob.size||blob.size>1048576){toast('Voice too long (max ~1 minute)','warning');renderVoiceUI();return;}
const r=new FileReader();
r.onload=e=>{
pendingVoice={src:e.target.result,dur:voiceSecs};
const pv=document.getElementById('ci-prev');
if(pv)pv.innerHTML=`<div class="glass p-2 mb-2 flex items-center gap-3" style="border-color:rgba(239,68,64,.4)">
<div class="rec-pulse" style="width:40px;height:40px;animation:none"><i data-lucide="mic" class="w-5 h-5 text-white"></i></div>
<span class="text-[12.5px] font-bold text-white/80 flex-1">🎤 Voice ready · ${fmtDur(voiceSecs)}</span>
<button class="a-btn danger" onclick="pendingVoice=null;document.getElementById('ci-prev').innerHTML=''">Remove</button>
</div>`;
try{lucide.createIcons();}catch(x){}
};
r.readAsDataURL(blob);
renderVoiceUI();}

function renderVoiceUI(){
const prev=document.getElementById('ci-prev');
if(!prev)return;
if(voiceRecording){
prev.innerHTML=`<div class="glass p-2 mb-2 flex items-center gap-3" style="border-color:rgba(239,68,64,.5)">

/* ---------- 6.17 STATUS HELPERS ---------- */
const stActive=st=>st&&st.ts&&(Date.now()-st.ts)<864e5;

function statusesOf(uid){
return Object.entries(allStatus[uid]||{}).map(([k,v])=>({id:k,...v})).filter(m=>stActive(m)).sort((a,b)=>(a.ts||0)-(b.ts||0));}

function hasUnseenStatus(uid){
return statusesOf(uid).some(m=>!statusViewedLocal.has(uid+'|'+m.id));}

function statusUploaders(){
return Object.keys(allStatus).filter(uid=>uid!==MY.uid&&uid!=='system'&&!bannedUsers.has(uid)&&statusesOf(uid).length)
.sort((a,b)=>{
const au=hasUnseenStatus(a),bu=hasUnseenStatus(b);
if(au!==bu)return au?-1:1;
const la=statusesOf(a).slice(-1)[0]||{ts:0},lb=statusesOf(b).slice(-1)[0]||{ts:0};
return(lb.ts||0)-(la.ts||0);});}

async function markStatusViewed(uid,sid){
const k=uid+'|'+sid;
if(!uid||uid===MY.uid||statusViewedLocal.has(k))return;
statusViewedLocal.add(k);

/* ---------- 6.21 FEED WIRING ---------- */
function shWireFeed(){
const f=document.getElementById('sty-feed');
if(!f)return;
const tryPlay=v=>{
if(!v)return;
onlyPlayThis(v);
v.play().catch(()=>{v.muted=true;v.play().catch(()=>{});});};
 $$('#sty-feed video').forEach(v=>{
const key=v.id.replace('sty-vid-','');
const ov=document.getElementById('sty-ov-'+key);
v.onpause=()=>{if(ov)ov.style.display='flex';};
v.onplay=()=>{if(ov)ov.style.display='none';onlyPlayThis(v);};
if(v.paused)tryPlay(v);
});
const io=new IntersectionObserver(entries=>{
entries.forEach(en=>{
const uid=en.target.dataset.uid,sid=en.target.dataset.sid;
if(en.isIntersecting&&en.intersectionRatio>=.6){
window._shIdx=shFeed.findIndex(o=>o.uid===uid&&o.sid===sid);
stCurUid=uid;stCurSid=sid;
markStatusViewed(uid,sid);
const v=document.getElementById('sty-vid-'+uid+'-'+sid);
if(v){v.currentTime=0;tryPlay(v);}
const p=document.getElementById('sty-progress');
if(p)p.style.width=Math.round(((window._shIdx+1)/shFeed.length)*100)+'%';
}else{
const v=document.getElementById('sty-vid-'+uid+'-'+sid);
if(v&&!v.paused)v.pause();
}
});
},{root:f,threshold:[.6]});
 $$('#sty-feed .sty-item').forEach(it=>io.observe(it));
/* long-press quick reactions */
shFeed.forEach(o=>{
const it=document.getElementById('sty-item-'+o.uid+'-'+o.sid);
if(!it||it.dataset.rG)return;
it.dataset.rG='1';
const media=it.querySelector('.sty-media');
if(!media)return;
let lp=null,fired=false;
const start=()=>{fired=false;lp=setTimeout(()=>{fired=true;showQuickRx(o);},550);};
const cancel=()=>{clearTimeout(lp);};
const wrap=media.parentElement;
if(wrap){
wrap.addEventListener('touchstart',start,{passive:true});
wrap.addEventListener('touchend',cancel);
wrap.addEventListener('touchmove',cancel);
wrap.addEventListener('mousedown',start);
wrap.addEventListener('mouseup',cancel);
wrap.addEventListener('mouseleave',cancel);
wrap.addEventListener('click',e=>{if(fired){e.stopPropagation();e.preventDefault();fired=false;}},true);
}
});
/* keyboard nav */
if(!window._shKey){
window._shKey=e=>{
if(!statusOpen)return;
if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();styNext();}
else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();styPrev();}
else if(e.key==='Escape'){if(shCmtFor)shCloseComments();else closeStatusScreen();}
};
window.addEventListener('keydown',window._shKey);
}
}

/* ---------- 6.23 VIDEO CONTROLS ---------- */
function onlyPlayThis(v){
 $$('#sty-feed video').forEach(x=>{if(x!==v){try{x.pause();}catch(e){}}});}

function styTogglePlay(uid,sid){
const v=document.getElementById('sty-vid-'+uid+'-'+sid);
if(!v)return;
const ov=document.getElementById('sty-ov-'+uid+'-'+sid);
if(v.paused){
onlyPlayThis(v);
v.play().catch(()=>{v.muted=true;v.play().catch(()=>{});});
if(ov)ov.style.display='none';
}else{
v.pause();
if(ov)ov.style.display='flex';}}

function styVol(val,uid,sid){
const v=document.getElementById('sty-vid-'+uid+'-'+sid);
if(!v)return;
const n=Math.max(0,Math.min(100,+val||0));
v.volume=n/100;
v.muted=(n===0);
const lbl=document.getElementById('vv-'+uid+'-'+sid);
if(lbl)lbl.textContent=n+'%';
const ic=document.querySelector('#sty-item-'+uid+'-'+sid+' [data-role=sndic]');
if(ic)ic.textContent=(n===0)?'🔇':'🔊';}

function styMute(btn,uid,sid){
const v=document.getElementById('sty-vid-'+uid+'-'+sid);
if(!v)return;
v.muted=!v.muted;
if(!v.muted)v.volume=Math.max(.5,v.volume||1);
const ic=btn.querySelector('.ric'),lb=btn.querySelector('.rlbl');
if(ic)ic.textContent=v.muted?'🔇':'🔊';
if(lb)lb.textContent=v.muted?'Sound OFF':'Sound ON';
const sl=document.querySelector('#sty-item-'+uid+'-'+sid+' input[type=range]');
if(sl){
sl.value=v.muted?0:Math.round((v.volume||1)*100);
const lbl=document.getElementById('vv-'+uid+'-'+sid);
if(lbl)lbl.textContent=(v.muted?0:Math.round((v.volume||1)*100))+'%';
}}

function pickStatusFile(inp){
const f=inp.files&&inp.files[0];
if(f)handleStatusFile(f);
inp.value='';}

function handleStatusFile(f){
if(!f)return;
const isVid=f.type.startsWith('video/');
const maxMB=isVid?VID_MAX_MB:AV_MAX_MB;
if(f.size>maxMB*1048576)return toast((isVid?'Video':'Image')+' too big — max '+maxMB+'MB','warning');
if(isVid){
const r=new FileReader();
r.onprogress=e=>{
if(e.lengthComputable){
const p=Math.round(e.loaded/e.total*100);
const el=document.getElementById('st-prev');
if(el)el.innerHTML=`<div class="stprev"><div class="sp-loading"><div class="upring"></div><div class="text-[12px] text-white/60 mt-3">🎥 Reading… ${p}% · ${fmtMB(f.size)}</div></div></div>`;
}};
r.onload=e=>{
window._stFile=e.target.result;
window._stType='video';
stRenderPreview('🎥 Video',fmtMB(f.size),false);};
r.onerror=()=>toast('Could not read video','error');
r.readAsDataURL(f);
}else{
const r=new FileReader();
r.onload=async e=>{
try{
const img=new Image();
img.src=e.target.result;
await img.decode().catch(()=>{});
const sc=Math.min(1,720/(img.width||720));
const cv=document.createElement('canvas');
cv.width=Math.max(2,Math.round((img.width||720)*sc));
cv.height=Math.max(2,Math.round((img.height||720)*sc));
cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
window._stFile=cv.toDataURL('image/jpeg',.72);
window._stType='img';
stRenderPreview('🖼 Photo',fmtMB(f.size),window._stFile);
}catch(x){
window._stFile=e.target.result;
window._stType='img';
stRenderPreview('🖼 Photo','',e.target.result);
}};
r.readAsDataURL(f);}}

function stRenderPreview(kind,size,src){
const el=document.getElementById('st-prev');
if(!el)return;
el.innerHTML=`<div class="stprev">
 ${src?`<img src="${src}">`:`<div class="sp-loading"><div style="font-size:34px">🎬</div><div class="text-[13px] font-bold mt-2">${kind} ready</div></div>`}
<span class="sp-badge">${kind}${size?' · '+size:''}</span>
<button class="sp-x" onclick="window._stFile=null;window._stType=null;document.getElementById('st-prev').innerHTML=''">✕</button>
</div>`;}

async function postStatus(){
const cap=($('#st-cap').value||'').trim();
if(!window._stFile)return toast('Choose a photo or video first','warning');
 $('#admin-root').innerHTML=`<div class="modal-overlay" style="z-index:295"><div class="upcard">
<div class="upring"></div>
<b class="font-display text-[16px] block mt-4">Uploading…</b>

<div style="height:8px;background:rgba(255,255,255,.1);margin-top:14px;overflow:hidden"><div id="up-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#EC4899,#F97316,#FCD34D);transition:width .3s"></div></div>
<div class="text-[13px] font-extrabold mt-2" id="up-pct" style="color:#F472B6">0%</div>

let p=0;

p=Math.min(p+Math.random()*8+4,92);

},180);
try{
await db.ref('status/'+MY.uid).push({uid:MY.uid,name:MY.name,avatar:MY.avatar,ts:Date.now(),type:window._stType,src:window._stFile,caption:cap,views:{},likes:{},dislikes:{},comments:{}});
clearInterval(tick);
const b=document.getElementById('up-bar');
if(b)b.style.width='100%';
const pc=document.getElementById('up-pct');
if(pc)pc.textContent='100% ✓';
setTimeout(()=>{
closeAdminModal();
toast('Status posted! 🎉','success');
statusPing();
openStatusScreen(MY.uid);
},450);
}catch(e){
clearInterval(tick);
closeAdminModal();
toast('Upload failed — file too large. Try a smaller file.','error');
}}

/* ---------- 7.14 GAME REGISTRY + CONSTANTS ---------- */
const GM_GAMES=[
{id:'mathrush',e:'⚡',n:'Math Rush',d:'Mixed quick math',g:'linear-gradient(135deg,#F59E0B,#EF4444)'},
{id:'plusminus',e:'➕',n:'Plus & Minus',d:'Add and subtract',g:'linear-gradient(135deg,#3B82F6,#6366F1)'},
{id:'multitable',e:'✖️',n:'Times Table',d:'Multiplication',g:'linear-gradient(135deg,#EC4899,#F43F5E)'},

{id:'evensplit',e:'🔢',n:'Odd or Even',d:'Number sense',g:'linear-gradient(135deg,#8B5CF6,#4F46E5)'},
{id:'missing',e:'❓',n:'Missing Number',d:'Find the blank',g:'linear-gradient(135deg,#FBBF24,#F97316)'},
{id:'doubles',e:'⏫',n:'Doubles',d:'Double the number',g:'linear-gradient(135deg,#22D3EE,#0EA5E9)'},
{id:'squareroot',e:'📐',n:'Square Root',d:'Perfect squares',g:'linear-gradient(135deg,#A855F7,#7C3AED)'},
{id:'halfit',e:'🍰',n:'Half It',d:'Divide by two',g:'linear-gradient(135deg,#84CC16,#10B981)'},
{id:'nextnum',e:'📈',n:'Next Number',d:'Find the pattern',g:'linear-gradient(135deg,#F43F5E,#DC2626)'}];

const GM_LEVELS=20;
const GM_QUESTIONS=10;
const GM_LIVES=3;

function gmGame(gid){return GM_GAMES.find(x=>x.id===gid)||GM_GAMES[0];}

/* ---------- 7.15 NUMBER HELPERS ---------- */
function gmR(a,b){a=Math.ceil(a);b=Math.floor(b);return Math.floor(Math.random()*(b-a+1))+a;}
function gmShuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function gmUniqueOpts(ans,exclude){
ans=Number(ans)||0;
const s=new Set([ans]);
let guard=0;
while(s.size<4&&guard<80){
guard++;
let w=ans+gmR(1,Math.max(3,Math.round(Math.abs(ans)*.25)+3))*(Math.random()<.5?1:-1);
if(w<0)w=Math.abs(w)+1;
if(exclude&&exclude.indexOf(w)>-1)continue;
s.add(w);
}
return gmShuffle(Array.from(s).map(String));}

/* ---------- 7.16 QUESTION GENERATORS (sab 10) ---------- */
const GM_QGEN={};

GM_QGEN.mathrush=function(level){
const cap=12+level*8;
const r=gmR(3,cap);
const roll=Math.random();
if(roll<.4){const a=gmR(2,r),b=gmR(2,r);return{q:a+' + '+b,ans:String(a+b),opts:gmUniqueOpts(a+b)};}
if(roll<.75){const a=gmR(2,Math.min(12,3+Math.floor(level/2))),b=gmR(2,Math.min(15,4+level));return{q:a+' × '+b,ans:String(a*b),opts:gmUniqueOpts(a*b)};}
const a=gmR(Math.floor(r/2),r),b=gmR(2,Math.floor(r/2));
return{q:a+' − '+b,ans:String(a-b),opts:gmUniqueOpts(a-b)};};

GM_QGEN.plusminus=function(level){
const cap=10+level*9;
if(Math.random()<.5){const a=gmR(5,cap),b=gmR(5,cap);return{q:a+' + '+b,ans:String(a+b),opts:gmUniqueOpts(a+b)};}
const a=gmR(Math.floor(cap/2),cap),b=gmR(2,Math.floor(cap/2));
return{q:a+' − '+b,ans:String(a-b),opts:gmUniqueOpts(a-b)};};

GM_QGEN.multitable=function(level){
const tMax=Math.min(13,2+Math.ceil(level*.6));
const mMax=Math.min(12,3+Math.ceil(level*.5));
const a=gmR(2,tMax),b=gmR(2,mMax);
return{q:a+' × '+b,ans:String(a*b),opts:gmUniqueOpts(a*b)};};

GM_QGEN.bigsmall=function(level){
const cap=30+level*45;
let a=gmR(10,cap),b=gmR(10,cap);
while(a===b)b=gmR(10,cap);
const big=a>b;
return{q:a+'  ⚖  '+b,ans:big?'A':'B',opts:['A is bigger','B is bigger']};};

GM_QGEN.evensplit=function(level){
const cap=25+level*40;
const n=gmR(1,cap);
return{q:String(n),ans:(n%2===0)?'even':'odd',opts:['even','odd']};};

GM_QGEN.missing=function(level){
const bMax=Math.min(13,3+Math.ceil(level*.55));
const aMax=Math.min(14,4+Math.ceil(level*.5));
const b=gmR(2,bMax),a=gmR(2,aMax);
const q=a*b;
return{q:'? × '+b+' = '+q,ans:String(a),opts:gmUniqueOpts(a)};};

GM_QGEN.doubles=function(level){
const base=10+Math.floor(level*8)+gmR(0,Math.floor(level*.8)+4);
return{q:base+' × 2',ans:String(base*2),opts:gmUniqueOpts(base*2)};};

GM_QGEN.squareroot=function(level){
const rootMax=Math.min(20,4+Math.ceil(level*.85));
const n=gmR(2,rootMax);
return{q:'√'+(n*n),ans:String(n),opts:gmUniqueOpts(n)};};

GM_QGEN.halfit=function(level){
const halfMax=Math.min(60,8+Math.ceil(level*2.6));
const h=gmR(4,halfMax);
const full=2*h;
return{q:full+' ÷ 2',ans:String(h),opts:gmUniqueOpts(h)};};

GM_QGEN.nextnum=function(level){
const stepMax=Math.min(12,2+Math.ceil(level*.55));
const st0=gmR(2,10+level*2);
const step=gmR(2,stepMax);
const n1=st0,n2=st0+step,n3=st0+2*step,ans=st0+3*step;
return{q:n1+', '+n2+', '+n3+', ?',ans:String(ans),opts:gmUniqueOpts(ans,[n1,n2,n3])};};

function gmMakeQ(gid,level){
const gen=GM_QGEN[gid]||GM_QGEN.mathrush;
return gen(level);}

/* sanity check (console) */
(function(){
try{
let pass=true,fails=[];
GM_GAMES.forEach(g=>{
if(!GM_QGEN[g.id]){pass=false;fails.push(g.id+': no generator');return;}
for(let lvl=1;lvl<=GM_LEVELS;lvl+=3){
for(let i=0;i<10;i++){
const q=GM_QGEN[g.id](lvl);
if(!q||!q.q||!q.ans||!Array.isArray(q.opts)||q.opts.length<2){pass=false;fails.push(g.id+' L'+lvl+': bad shape');continue;}
const match=q.opts.filter(o=>String(o)===String(q.ans)).length;
if(match!==1){pass=false;fails.push(g.id+' L'+lvl+': ans "'+q.ans+'" match='+match);}
}
}
});
if(!pass)console.warn('[GM] generator check issues:',fails);
else console.log('[GM] all 10 game generators OK ✓');
}catch(e){console.warn('[GM] check error',e);}
})();

/* ---------- 7.21 ANSWER FLOW (FIXED — no double answer bug) ---------- */
function gmAnswer(i){
const st=window._gm;
if(!st||st.phase!=='play'||st.busy)return;
const q=st.q;
if(!q||i<0||i>=q.opts.length)return;
st.busy=true;
const btns=$$('.gm-ans');
btns.forEach(b=>{b.onclick=null;});
const ok=String(q.opts[i])===String(q.ans);
if(btns[i])btns[i].classList.add(ok?'ok':'no');
if(ok){
st.correct++;
st.combo++;
if(st.combo>st.bestCombo)st.bestCombo=st.combo;
beep();
}else{
btns.forEach((b,n)=>{if(String(q.opts[n])===String(q.ans))b.classList.add('ok');});
st.wrong++;
st.lives=Math.max(0,st.lives-1);
st.combo=0;
gmFlash('bad');
}
gmUpdateHUD();
setTimeout(function(){
if(window._gm!==st)return;
st.busy=false;
st.qi++;
if(st.lives<=0)gmLevelEnd(false);
else if(st.qi>=GM_QUESTIONS)gmLevelEnd(true);
else gmShowQuestion();
},ok?450:900);}

function gmShowQuestion(){
const st=window._gm;
if(!st||st.phase!=='play')return;
if(st.sharedSet&&st.sharedSet[st.qi])st.q=st.sharedSet[st.qi];
else st.q=gmMakeQ(st.gid,st.level);
st.timeLeft=st.timeMax;
st.busy=false;
const qEl=document.getElementById('gm-q');
if(!qEl)return;
qEl.textContent=String(st.q.q);

/* ---------- 7.23 LEVEL END — STARS · XP · SAVE (FIXED stars) ---------- */
async function gmLevelEnd(completed){
const st=window._gm;
if(!st||st.phase==='ended')return;
st.phase='ended';
st.timeLeft=0;
const g=gmGame(st.gid);
const stars=completed?(st.wrong===0?3:(st.wrong===1?2:1)):0;
const xp=st.correct*5+Math.floor(st.bestCombo/3)*5+(completed?st.level*10+(stars===3?20:0):0);
st.result={completed,stars,xp,correct:st.correct,wrong:st.wrong,bestCombo:st.bestCombo};
const updates={};
const old=MY.xp||0;
if(xp>0)updates.xp=old+xp;
if(completed&&!st.challenge){
const prog=((MY.games||{})[st.gid])||{unlocked:1,stars:{},correct:0,played:0};
const newUnlocked=Math.min(GM_LEVELS,Math.max(prog.unlocked||1,st.level+1));
const prevStars=+(((prog.stars||{})[st.level])||0);
updates['games/'+st.gid+'/unlocked']=newUnlocked;
if(stars>prevStars)updates['games/'+st.gid+'/stars/'+st.level]=stars;
updates['games/'+st.gid+'/correct']=(prog.correct||0)+st.correct;
updates['games/'+st.gid+'/played']=(prog.played||0)+1;
updates['gamesTotal']=(MY.gamesTotal||0)+1;
}
try{
if(Object.keys(updates).length)await db.ref('users/'+MY.uid).update(updates);
MY.xp=old+Math.max(0,xp);
if(completed&&!st.challenge){
const prog2=((MY.games||{})[st.gid])||{};
const newStars={...(prog2.stars||{})};
if(stars>(+newStars[st.level]||0))newStars[st.level]=stars;
MY.games={...(MY.games||{}),[st.gid]:{
unlocked:Math.min(GM_LEVELS,Math.max((prog2.unlocked||1),st.level+1)),
stars:newStars,
correct:(prog2.correct||0)+st.correct,
played:(prog2.played||0)+1}};
MY.gamesTotal=(MY.gamesTotal||0)+1;
}
incDaily('game');
}catch(e){}
if(xp>0){flyXP('🎮 +'+xp+' XP!');checkLevelUp(old,old+xp);}
if(stars===3){fireConfetti();beep();}
if(st.challenge){try{gmReportChallenge(st);}catch(e){}}
/* end screen render (DOM-direct, no blink) */
const main=document.querySelector('#app main');
if(main){
main.innerHTML=gmEndHTML(g,st);
window.scrollTo(0,0);
}else{render();}
try{lucide.createIcons();}catch(e){}}

/* ---------- 7.27 CHALLENGES — SEED & SET ---------- */
function gmSeededShuffle(arr,seed){
let s=Number(seed)||1;
const rnd=function(){s=(s*9301+49297)%233280;return s/233280;};
const a=arr.slice();
for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}
return a;}

function gmBuildFixedSet(gid){
const qs=[];
for(let i=0;i<GM_QUESTIONS;i++)qs.push(gmMakeQ(gid,6));
return qs;}

a=String(a).toLowerCase().trim();
b=String(b).toLowerCase().trim();
const key=[a,b].sort().join('♡');

for(let i=0;i<key.length;i++)h=((h<<5)-h+key.charCodeAt(i))|0;

/* ---------- 8.9 UNIT CONVERTER ---------- */
const CONV_UNITS={km:{n:'Kilometers',sym:'km'},mi:{n:'Miles',sym:'mi'},kg:{n:'Kilograms',sym:'kg'},lb:{n:'Pounds',sym:'lb'},cm:{n:'Centimeters',sym:'cm'},in:{n:'Inches',sym:'in'}};
const CONV_RATES={km:{mi:.621371},mi:{km:1.60934},kg:{lb:2.20462},lb:{kg:.453592},cm:{in:.393701},in:{cm:2.54}};

function pageToolConv(){
const f=qrVals.cvF||'km',t=qrVals.cvT||'mi';
return `<div class="tool-wrap fade-up">
<button class="btn-ghost px-4 py-2 text-sm font-bold mb-4" onclick="navBack()">← Back</button>

<div><label class="lbl">From</label>
<select id="cv-f" class="input-field">${Object.keys(CONV_UNITS).map(k=>`<option value="${k}" ${f===k?'selected':''}>${CONV_UNITS[k].n} (${CONV_UNITS[k].sym})</option>`).join('')}</select></div>
<div><label class="lbl">To</label>
<select id="cv-t" class="input-field">${Object.keys(CONV_UNITS).map(k=>`<option value="${k}" ${t===k?'selected':''}>${CONV_UNITS[k].n} (${CONV_UNITS[k].sym})</option>`).join('')}</select></div>
</div>
<div class="flex justify-center my-2">
<button class="a-btn" onclick="cvSwap()" title="Swap units">🔄 Swap ⇄</button>
</div>

<button class="btn-primary w-full py-3.5 font-extrabold mt-3" onclick="doConv()" style="background:linear-gradient(135deg,#06B6D4,#3B82F6)">🔄 CONVERT</button>
<div id="cv-out" class="mt-3">${window._cvRes?cvResultHTML():''}</div>
</div>
 ${gmHistSection('basiler_convhist','🕘 Conversion History')}
</div>`;}

function cvSwap(){
const f=(document.getElementById('cv-f')||{}).value,t=(document.getElementById('cv-t')||{}).value;
qrVals.cvF=t;qrVals.cvT=f;
window._cvRes=null;
render();}

function cvResultHTML(){
const r=window._cvRes;
return `<div class="glass p-3 text-center a-zoomHit">
<div class="text-white/40 text-[11px]">${esc(r.from)} =</div>
<div class="font-display font-extrabold text-2xl" style="color:#67E8F9">${r.result} ${esc(r.toSym)}</div>
<button class="a-btn mt-2" onclick="navigator.clipboard.writeText('${r.result}').then(()=>toast('Copied 📋','success'))">📋 Copy</button>
</div>`;}

function doConv(){
const f=(document.getElementById('cv-f')||{}).value;
const t=(document.getElementById('cv-t')||{}).value;
const v=parseFloat((document.getElementById('cv-v')||{}).value);
qrVals.cvF=f;qrVals.cvT=t;
if(isNaN(v))return toast('Enter a number first','warning');
if(f===t){
window._cvRes={from:v+' '+CONV_UNITS[f].sym,result:String(v),toSym:CONV_UNITS[t].sym};
const out=document.getElementById('cv-out');
if(out)out.innerHTML=cvResultHTML();
return;}
const rate=CONV_RATES[f]&&CONV_RATES[f][t];
if(!rate)return toast('Cannot convert these units','warning');
const r=v*rate;
const res=(Math.abs(r)>=100||Number.isInteger(r))?r.toFixed(2):r.toFixed(4);
window._cvRes={from:v+' '+CONV_UNITS[f].sym,result:res,toSym:CONV_UNITS[t].sym};
const out=document.getElementById('cv-out');
if(out)out.innerHTML=cvResultHTML();
pushHist('basiler_convhist',{t:'🔄 '+v+' '+CONV_UNITS[f].sym+' → '+CONV_UNITS[t].sym,v:res+' '+CONV_UNITS[t].sym,d:gmStamp()},12);
beep();}

/* ---------- 8.10 STOPWATCH (+ LAPS) ---------- */
function fmtSW(ms){
ms=Math.max(0,ms||0);
const m=Math.floor(ms/60000);
const s=Math.floor(ms%60000/1000);
const c=Math.floor(ms%1000/10);
return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0');}

function swNow(){return(window._swEl||0)+(window._swRun?(Date.now()-window._swStart):0);}

function pageToolStop(){
const laps=window._swLaps||[];
return `<div class="tool-wrap fade-up" style="max-width:480px">

<div class="flex gap-2">
<button class="btn-primary flex-1 py-3 font-extrabold" id="sw-toggle-btn" onclick="swToggle()" style="background:linear-gradient(135deg,${window._swRun?'#EF4444,#DC2626':'#F59E0B,#EF4444'})">${window._swRun?'⏸ PAUSE':'▶ START'}</button>
<button class="btn-ghost px-4 py-3 font-extrabold" id="sw-lap-btn" onclick="swLap()" ${window._swRun?'':'disabled style="opacity:.4"'}>🏁 LAP</button>
<button class="btn-ghost px-4 py-3 font-extrabold" onclick="swReset()">🔄 RESET</button>
</div>
</div>
 ${laps.length?`<div class="glass-strong p-4 mt-4">
<div class="flex items-center gap-2 mb-3"><i data-lucide="flag" class="w-4 h-4 text-yellow-400"></i><b class="font-display">🏁 Laps (${laps.length})</b></div>
 ${laps.slice().reverse().map((l,i)=>{
const n=laps.length-i;
return `<div class="sw-lap"><span style="color:#FBBF24">Lap ${n}</span><span>${fmtSW(l.split)}</span><span style="color:rgba(255,255,255,.5)">${fmtSW(l.total)}</span></div>`;
}).join('')}
</div>`:''}
 ${gmHistSection('basiler_swhist','🕘 Run History')}
</div>`;}

function swToggle(){
if(window._swRun){
window._swEl=(window._swEl||0)+(Date.now()-window._swStart);
window._swRun=false;
clearInterval(window._swT);
beep();
}else{
window._swStart=Date.now();
window._swRun=true;
beep();
window._swT=setInterval(()=>{
const d=document.getElementById('sw-d');
if(d)d.textContent=fmtSW(swNow());
},31);
}
const b=document.getElementById('sw-toggle-btn');
if(b){
b.textContent=window._swRun?'⏸ PAUSE':'▶ START';
b.style.background=`linear-gradient(135deg,${window._swRun?'#EF4444,#DC2626':'#F59E0B,#EF4444'})`;
}
const st=document.getElementById('sw-state');
if(st)st.textContent=(window._swRun?'● RUNNING':'○ stopped')+' · '+((window._swLaps||[]).length)+' laps';
const lb=document.getElementById('sw-lap-btn');
if(lb){
if(window._swRun){lb.disabled=false;lb.style.opacity=1;}
else{lb.disabled=true;lb.style.opacity=.4;}
}}

function swLap(){
if(!window._swRun)return;
const total=swNow();
const laps=window._swLaps=window._swLaps||[];
const prev=laps.length?laps[laps.length-1].total:0;
laps.push({total,split:total-prev});
beep();
render();}

function swReset(){
const t=swNow();
const laps=window._swLaps||[];
clearInterval(window._swT);
window._swRun=false;window._swEl=0;window._swLaps=[];
if(t>3000){
pushHist('basiler_swhist',{t:'⏱ Stopwatch run',v:fmtSW(t)+(laps.length?' · '+laps.length+' laps':''),d:gmStamp()},10);
toast('Run saved: '+fmtSW(t),'info');
}else{
toast('Stopwatch reset','info');

render();}

fireConfetti();
beep();
pkBusy=false;
}
};
step();}

await db.ref('meta/settings').update({theme:-1,customBg:c});
SETTINGS.customBg=c;SETTINGS.theme=-1;
applySettings(SETTINGS);
toast('🌍 Applied to ALL users!','success');
render();
}catch(e){showFirebaseError(e);}}

/* ---------- 8.21 PRIVACY (masked passwords) ---------- */
function pageAdminPrivacy(){
const accs=Object.values(adminAccounts||{}).sort((a,b)=>((b.createdAt||0)-(a.createdAt||0)));
window._pwMap={};
return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}
 ${impLiveBox()}
<h2 class="font-display font-extrabold text-2xl mb-1">🔒 Privacy & Accounts</h2>
<p class="text-white/45 text-sm mb-3">Total accounts: ${accs.length} · passwords masked</p>
<div class="glass p-3 mb-4 text-[11.5px] text-white/45 flex items-center gap-2">
<i data-lucide="shield" class="w-4 h-4 text-yellow-400"></i> 🔐 Naye accounts ka password store NAHI hota. Purane accounts masked dikhte hain — 👁 se dekho.
</div>
 ${accs.map(a=>{
let pw='';
try{pw=a.pw?decPass(a.pw):'';}catch(e){pw='';}
if(pw)window._pwMap[a.uid]=pw;
const masked=pw?(pw[0]+'•'.repeat(Math.max(1,pw.length-2))+pw[pw.length-1]):'(not stored)';
return `<div class="a-row">
<img src="${(allUsers[a.uid]||{}).avatar||AVATAR_PRESETS[0]}" class="w-10 h-10 object-cover">
<div class="flex-1 trunc-wrap" style="min-width:200px">
<div class="text-[14px] font-bold">👤 ${esc(a.name)} <span class="text-[10px] text-cyan-300 font-bold">${userCode(a.uid)}</span></div>
<div class="text-[12px] text-white/60 clamp1">📧 ${esc(a.email)}</div>
<div class="text-[12px] font-bold" style="color:#FCD34D" id="pw-${esc(a.uid)}">🔑 ${esc(masked)}</div>
</div>
 ${pw?`<button class="a-btn" onclick="pwToggle('${esc(a.uid)}')" title="Reveal">👁</button>`:''}
<button class="a-btn danger" onclick="adminDeleteAcc('${esc(a.uid)}','${emailKey(a.email)}')">Delete</button>
</div>`;}).join('')||emptyState('lock','No accounts')}
</div>`;}

function pwToggle(uid){
const el=document.getElementById('pw-'+uid);
if(!el)return;
const full=(window._pwMap||{})[uid];
if(!full)return;
if(el.dataset.shown==='1'){
el.dataset.shown='';
const masked=full[0]+'•'.repeat(Math.max(1,full.length-2))+full[full.length-1];
el.textContent='🔑 '+masked;
}else{
el.dataset.shown='1';
el.textContent='🔑 '+full;
}}

/* ---------- 8.22 GLOBAL SETTINGS ---------- */
function pageAdminSettings(){
return `<div class="max-w-2xl mx-auto fade-up">${adminBackBtn}
<h2 class="font-display font-extrabold text-2xl mb-1">⚙ Global Settings</h2>
<p class="text-white/45 text-sm mb-2">Applies to ALL users instantly</p>
<div class="glass-strong p-6">
<label class="lbl">Website Name (all users)</label>
<div class="flex gap-2 mb-3">
<input id="ad-name" class="input-field" maxlength="20" value="${esc(SETTINGS.name)}">
<button class="a-btn" onclick="adminSaveName()">Save</button>
</div>
<label class="lbl">Chatter App Name (all users)</label>
<div class="flex gap-2 mb-3">
<input id="ad-cname" class="input-field" maxlength="20" value="${esc(SETTINGS.chatName)}">
<button class="a-btn" onclick="adminSaveChatName()">Save</button>
</div>

<div class="flex gap-2 flex-wrap mb-2">
 ${CHAT_WALLS.map((w,i)=>`<div class="solid-sw ${(SETTINGS.chatWall===i)?'sel':''}" style="background:${w.bg||'rgba(255,255,255,.05)'};width:38px;height:38px" title="${w.n}" onclick="adminSetWall(${i})"></div>`).join('')}
</div>
<div class="glass p-2.5 mb-5 text-[11px] text-white/45">Note: agar user ne apna wallpaper chuna hai to wohi chalta hai; warna admin wala sab pe dikhega.</div>
<label class="lbl">Global Themes (${THEMES.length})</label>

 ${THEMES.map((t,i)=>`<div class="theme-sw ${SETTINGS.theme===i?'sel':''}" style="background:${t.bg||'radial-gradient(circle at 30% 30%,#312e81,#06070D)'}" onclick="adminSetTheme(${i})"><span>${t.n}</span></div>`).join('')}
</div>
<label class="lbl">Toggles</label>
<div class="a-row"><span class="flex-1 text-[13px]">👁 Public "Who Voted"</span>
<button class="a-btn" onclick="adminToggle('publicVoters')">${SETTINGS.publicVoters?'ON ✅':'OFF'}</button></div>
<div class="a-row"><span class="flex-1 text-[13px]">Clear ALL chats</span>
<button class="a-btn danger" onclick="clearChatNow()">Clear</button></div>
</div></div>`;}

async function adminSaveName(){
const n=((document.getElementById('ad-name')||{}).value||'').trim();
if(!n)return;
try{
await db.ref('meta/settings/name').set(n);
SETTINGS.name=n;
toast('Updated for ALL 🌍','success');
render();
}catch(e){showFirebaseError(e);}}

async function adminSaveChatName(){
const n=((document.getElementById('ad-cname')||{}).value||'').trim();
if(!n)return;
try{
await db.ref('meta/settings/chatName').set(n);
SETTINGS.chatName=n;
toast('Updated for ALL 🌍','success');
render();
}catch(e){showFirebaseError(e);}}

async function adminSetTheme(i){
if(i<0||i>=THEMES.length)return toast('Invalid theme','warning');
try{
await db.ref('meta/settings').update({theme:i,customBg:null});
SETTINGS.theme=i;SETTINGS.customBg='';
applySettings(SETTINGS);
toast('🌍 Theme applied to ALL!','success');
render();
}catch(e){showFirebaseError(e);}}

async function adminSetWall(i){
if(i<0||i>=CHAT_WALLS.length)return toast('Invalid wallpaper','warning');
try{
await db.ref('meta/settings/chatWall').set(i);
SETTINGS.chatWall=i;
toast('🌍 Wallpaper applied to ALL!','success');
render();
}catch(e){showFirebaseError(e);}}

async function adminToggle(k){
const v=!SETTINGS[k];
try{
await db.ref('meta/settings/'+k).set(v);
SETTINGS[k]=v;
toast(k+' → '+(v?'ON':'OFF'),'info');
render();
}catch(e){showFirebaseError(e);}}

/* ---------- 8.23 LEGACY CLEANUP ---------- */
async function removeElonBattle(){
try{
const bs=(await db.ref('battles').once('value')).val()||{};
for(const[id,b]of Object.entries(bs)){
if(b&&/Elon\s*Musk\s*vs\s*Bill\s*Gates/i.test(String(b.title||''))){
await db.ref('battles/'+id).remove();
await db.ref('comments/'+id).remove();
}
}
}catch(e){}}

async function removeBotBattles(){
try{
const bs=(await db.ref('battles').once('value')).val()||{};
for(const[id,b]of Object.entries(bs)){
if(b&&(b.creator==='system'||/Votify\s*Bot/i.test(String(b.creatorName||'')))){
await db.ref('battles/'+id).remove();
await db.ref('comments/'+id).remove();
}
}
}catch(e){}}

async function deleteDefaultBattles(){
try{
const rx=/Messi\s*vs\s*Ronaldo|Google\s*vs\s*Microsoft\s*Edge/i;
const bs=(await db.ref('battles').once('value')).val()||{};
for(const[id,b]of Object.entries(bs)){
if(b&&rx.test(String(b.title||''))){
await db.ref('battles/'+id).remove();
await db.ref('comments/'+id).remove();
}
}
const rs=(await db.ref('results').once('value')).val()||{};
for(const[id,r]of Object.entries(rs)){
if(r&&rx.test(String(r.title||'')))await db.ref('results/'+id).remove();
}
}catch(e){}}

/* ---------- 8.24 GLOBAL ESCAPE ---------- */
document.addEventListener('keydown',e=>{
if(e.key!=='Escape')return;
const mr=document.getElementById('modal-root');
if(mr&&mr.innerHTML){closeModal();return;}
const ar=document.getElementById('admin-root');
if(ar&&ar.innerHTML){closeAdminModal();return;}
});

/* ---------- 8.25 BOOT SEQUENCE ---------- */
(async()=>{
document.documentElement.style.setProperty('--bubble',bubbleColor);
try{lucide.createIcons();}catch(e){}
applyDayNight();
/* settings load (auth screen names) */
try{
const s=(await db.ref('meta/settings').once('value')).val()||{};
applySettings(s);
}catch(e){}
/* legacy cleanup (fire & forget) */
removeElonBattle();
removeBotBattles();
deleteDefaultBattles();
/* deep link: #battle=<id> */
const h=location.hash.match(/#battle=(.+)/);
if(h){view='battle';viewParam=decodeURIComponent(h[1]);}
/* impersonation restore (admin only) */
const impUid=isAdmin?localStorage.getItem('basiler_impersonate'):null;
if(impUid){
try{
const u=(await db.ref('users/'+impUid).once('value')).val();
if(u){startApp({uid:impUid,...u});return;}
}catch(e){}
localStorage.removeItem('basiler_impersonate');
}
/* session restore */
const sess=loadSession();
if(sess&&sess.uid){
try{
const u=(await db.ref('users/'+sess.uid).once('value')).val();
if(u){startApp({uid:sess.uid,...u});return;}
/* account hai par user node missing → rebuild */
if(sess.email){
const acc=(await db.ref('accounts/'+emailKey(sess.email)).once('value')).val();
if(acc&&acc.uid===sess.uid){
await db.ref('users/'+sess.uid).set({name:acc.name,email:acc.email,avatar:acc.avatar||AVATAR_PRESETS[0],xp:0,createdAt:acc.createdAt||Date.now(),loginCount:1,lastLogin:Date.now(),timeSpent:0});
startApp({uid:sess.uid,name:acc.name,email:acc.email,avatar:acc.avatar||AVATAR_PRESETS[0],xp:0});
return;
}
}
}catch(e){}
clearSession();
}
showAuth();
})();
</script>
