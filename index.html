<style>
:root{--bubble:#0E9F6E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#06070D;color:#F4F5FB;font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:radial-gradient(800px 600px at 12% 8%,rgba(99,102,241,.18),transparent 60%),radial-gradient(900px 700px at 88% 20%,rgba(168,85,247,.15),transparent 60%),radial-gradient(700px 500px at 50% 100%,rgba(59,130,246,.12),transparent 60%),linear-gradient(180deg,#04050A,#06070D)}

body.themed::before{display:none}body.themed #theme-bg{display:block}
.font-display{font-family:'Sora',sans-serif}
.glass{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px)}
.glass-strong{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(24px)}
.gradient-text{background:linear-gradient(135deg,#A5B4FC,#C4B5FD 35%,#F0ABFC 65%,#FCD34D);-webkit-background-clip:text;background-clip:text;color:transparent}
.gradient-brand{background:linear-gradient(135deg,#4F46E5,#7C3AED 50%,#A855F7)}
.glow-brand{box-shadow:0 10px 40px -8px rgba(99,102,241,.6)}
.card-hover{transition:transform .3s,border-color .3s,box-shadow .3s}
.card-hover:hover{transform:translateY(-4px);border-color:rgba(129,140,248,.35);box-shadow:0 20px 50px -20px rgba(99,102,241,.35)}
.btn-primary{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;border:none;cursor:pointer;transition:.25s;box-shadow:0 8px 30px -8px rgba(99,102,241,.55)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;cursor:pointer;transition:.2s}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.nav-link{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:12px;color:#B4B7CB;font-weight:500;font-size:14.5px;cursor:pointer;transition:.2s;position:relative}
.nav-link:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav-link.active{color:#fff;background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(168,85,247,.12));border:1px solid rgba(129,140,248,.25)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.scale-in{animation:scaleIn .3s ease both}
@keyframes slideR{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
.slide-in{animation:slideR .35s ease both}
.option-tile{transition:.3s;cursor:pointer;position:relative;overflow:hidden}
.option-tile:hover{transform:translateY(-3px)}
.option-tile.voted{border-color:rgba(129,140,248,.7)!important;box-shadow:0 0 40px -10px rgba(99,102,241,.6)}
.option-tile.ended{cursor:default}.option-tile.ended:hover{transform:none}
.confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:9999;animation:cFall 2.5s ease-out forwards}
@keyframes cFall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
input,textarea,select{font-family:inherit}input:focus,textarea:focus,select:focus{outline:none}
.input-field{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px 14px;color:#fff;width:100%;font-size:14.5px;transition:.2s}
.input-field:focus{border-color:rgba(129,140,248,.5);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.input-field::placeholder{color:#5C5F77}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.live-dot{width:8px;height:8px;border-radius:50%;background:#10B981;box-shadow:0 0 0 0 rgba(16,185,129,.7);animation:pulse 1.8s infinite;flex-shrink:0}

.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:rgba(255,255,255,.4);margin:14px 0 6px}

.a-tab:hover{color:#fff}.a-tab.active{color:#fff;background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4)}

.auth-screen{position:fixed;inset:0;z-index:200;background:#05060D;animation:fadeUp .4s;display:flex;overflow:hidden}

.auth-card{width:100%;max-width:420px;background:rgba(12,14,26,.9);backdrop-filter:blur(30px);border:1px solid rgba(236,72,153,.4);border-radius:0;padding:36px;box-shadow:0 0 60px rgba(236,72,153,.2), inset 0 0 30px rgba(236,72,153,.05);position:relative;overflow:hidden}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#EC4899,#A855F7,#6366F1)}
.auth-head{display:flex;align-items:center;gap:14px;margin-bottom:32px}

.remember-check input{accent-color:#6366F1;width:16px;height:16px;cursor:pointer}

.auth-hero{position:relative;padding:50px;display:flex;flex-direction:column;justify-content:flex-start;gap:30px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.06);height:100%;box-sizing:border-box;order:2}
.hglow{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none}
.hg1{width:500px;height:500px;background:rgba(124,58,237,.5);top:-150px;left:-120px}
.hg2{width:440px;height:440px;background:rgba(6,182,212,.4);top:30%;right:-130px}
.hg3{width:380px;height:380px;background:rgba(245,158,11,.2);bottom:-140px;left:30%}
.auth-hero>*{position:relative;z-index:2}
.stat3{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);min-width:130px}
.stat3 b{font-family:'Sora';font-size:22px;display:block;line-height:1.1}
.stat3 span{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.feat-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px}

@media(max-width:900px){.auth-inner{grid-template-columns:1fr;height:auto;min-height:100vh}.auth-hero{display:none}.auth-form-side{padding:16px;height:auto;min-height:100vh;align-items:center}.auth-card{padding:24px}}

.home-hero{position:relative;border-radius:28px;padding:34px 30px;overflow:hidden}

.vs-wrap{position:relative}.vs-circle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#A855F7);display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:800;font-size:13px;color:#fff;box-shadow:0 8px 24px -6px rgba(99,102,241,.7);border:3px solid #0A0B16;z-index:5}
.upload-box{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed rgba(255,255,255,.18);border-radius:14px;padding:16px 10px;cursor:pointer;transition:.2s;color:rgba(255,255,255,.5);font-size:12px;font-weight:600;text-align:center;aspect-ratio:1/.9}

.upload-box img{width:100%;height:100%;object-fit:cover;border-radius:12px}

.chat-page{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:#04150E}
.chat-header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.4);backdrop-filter:blur(24px)}
.chat-logo-badge{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#10B981,#06B6D4);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px -8px rgba(16,185,129,.6);flex-shrink:0}
.icobtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:.2s;flex-shrink:0;position:relative}

.chat-layout{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}

.side-search{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.05)}

.side-tab{flex:1;padding:12px;text-align:center;font-weight:700;font-size:13px;color:rgba(255,255,255,.5);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;transition:.2s}
.side-tab.active{color:#fff;border-bottom-color:#10B981;background:rgba(16,185,129,.05)}
.user-row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;border:1px solid transparent;border-radius:16px;margin:4px 8px;transition:.2s;position:relative}
.user-row:hover{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.2)}
.user-row.active{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.4);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.user-row img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.1)}
.chat-msgs{flex:1;overflow-y:auto;padding:20px 16px}.chat-msgs.fs-s{font-size:13px}.chat-msgs.fs-m{font-size:14.5px}.chat-msgs.fs-l{font-size:16.5px}
.msg-row{display:flex;gap:10px;margin-bottom:16px;animation:fadeUp .25s ease both}.msg-row.mine{flex-direction:row-reverse}
.msg-av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;cursor:pointer;margin-top:2px;background:rgba(255,255,255,.1)}
.msg-body{max-width:75%;display:flex;flex-direction:column}.msg-row.mine .msg-body{align-items:flex-end}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:1em;line-height:1.45;word-break:break-word;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.msg-row.mine .msg-bubble{background:var(--bubble);border-bottom-right-radius:4px;color:#fff}

.day-div{display:flex;align-items:center;gap:10px;margin:20px 0;color:rgba(255,255,255,.4);font-size:11px;font-weight:700;text-transform:uppercase}

.quote{border-left:3px solid #10B981;background:rgba(16,185,129,.08);border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:.85em;color:rgba(255,255,255,.65)}.quote b{color:#6EE7B7}
.rx-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.rx-chip{font-size:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:2px 8px;cursor:pointer}.rx-chip.mine{border-color:#10B981;background:rgba(16,185,129,.15)}
.msg-act{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#cbd5e1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;font-size:12px}
.msg-act:hover{background:rgba(16,185,129,.2);color:#fff}
.chat-input-area{padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3);backdrop-filter:blur(20px)}
.chat-bar{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:5px 6px 5px 16px;transition:.2s}
.chat-bar:focus-within{border-color:rgba(16,185,129,.55);box-shadow:0 0 0 3px rgba(16,185,129,.12);background:rgba(255,255,255,.08)}
#chat-inp{flex:1;background:transparent;border:none;color:#fff;font-size:14.5px;height:40px;min-width:0}
.ci-btn{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:.2s;background:transparent;color:#9CA3AF}
.ci-btn:hover{background:rgba(16,185,129,.14);color:#fff}
.ci-send{background:linear-gradient(135deg,#10B981,#06B6D4)!important;color:#fff!important;box-shadow:0 6px 18px -6px rgba(16,185,129,.7)}

.center-modal{position:fixed;inset:0;z-index:230;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;animation:scaleIn .25s ease both;backdrop-filter:blur(8px)}
.center-card{width:100%;max-width:430px;max-height:86vh;overflow-y:auto;background:#0B1F1A;border:1px solid rgba(16,185,129,.4);border-radius:22px;padding:20px;box-shadow:0 30px 90px -20px rgba(0,0,0,.9)}
.set-head{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.45);margin:14px 0 8px}

.fs-btn.active{background:linear-gradient(135deg,#10B981,#06B6D4);border-color:rgba(16,185,129,.5)}
.bub-dot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.2s}.bub-dot.sel{border-color:#fff;transform:scale(1.15)}
.solid-sw{width:44px;height:44px;border-radius:13px;cursor:pointer;border:2px solid rgba(255,255,255,.15);transition:.2s;position:relative}
.solid-sw.sel{border-color:#fff;transform:scale(1.1);box-shadow:0 0 16px rgba(255,255,255,.35)}
.solid-sw.sel::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.s-set{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;transition:.2s}

@media(max-width:768px){.chat-layout{grid-template-columns:1fr}.chat-side{position:absolute;inset:0;z-index:10;background:#04150E;display:none}.chat-side.open{display:flex}.only-mobile{display:flex!important}.msg-body{max-width:86%}}
.only-mobile{display:none!important}
@media(max-width:1024px){.main-content{margin-left:0!important;padding-top:74px}.desktop-sidebar{display:none}.mobile-topbar{display:flex}}

.modal-overlay{position:fixed;inset:0;z-index:210;background:rgba(4,5,10,.8);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;animation:scaleIn .25s ease both}
.modal-card{width:100%;max-width:400px;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,#0A0B16,#06070D);border:1px solid rgba(129,140,248,.3);border-radius:24px;padding:22px}
.a-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);margin-bottom:8px;flex-wrap:wrap}
.a-btn{padding:6px 12px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff}.a-btn:hover{background:rgba(255,255,255,.12)}

// MAX LEVEL 1000 LOGIC
const MAX_LEVEL = 1000;
function getLevelData(xp) {
    xp = xp || 0;
    const currentLvl = Math.min(MAX_LEVEL, Math.floor(Math.sqrt(xp / 50)) + 1);
    const prevReq = Math.pow(currentLvl - 1, 2) * 50;
    const nextReq = Math.pow(currentLvl, 2) * 50;
    const isMax = currentLvl >= MAX_LEVEL;
    const progress = isMax ? 100 : ((xp - prevReq) / (nextReq - prevReq)) * 100;
    const xpToNext = isMax ? 0 : (nextReq - xp);
    return { currentLvl, prevReq, nextReq, progress: Math.max(0, Math.min(100, progress)), xpToNext, isMax };
}
const levelOf = xp => getLevelData(xp).currentLvl;

async function doSignup(){
const name=$('#au-name').value.trim(),email=$('#au-email').value.trim().toLowerCase(),pass=$('#au-pass').value;
if(name.length<2)return toast('Please enter your name','warning');
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Enter a valid email','warning');
if(pass.length<4)return toast('Password must be 4+ characters','warning');
try{
const key=emailKey(email);
if((await db.ref('accounts/'+key).once('value')).exists())return toast('Email already registered','warning');
const uid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const avatar=AVATAR_PRESETS[Math.floor(Math.random()*20)];
await db.ref('accounts/'+key).set({uid,name,email,pass:hashPass(pass),pw:encPass(pass),createdAt:Date.now()});
await db.ref('users/'+uid).set({name,email,avatar,xp:0,votesCount:0,streakDays:0,bio:'',links:[],createdAt:Date.now()});
localStorage.setItem('basiler_session',JSON.stringify({email,uid}));
startApp({uid,name,email,avatar,xp:0,links:[],bio:'',createdAt:Date.now()});
toast('Welcome, '+name+'! Your ID: '+userCode(uid)+' 🎉','success');fireConfetti();
}catch(e){console.error(e);toast('Signup failed — check connection','error');}}

async function doLogin(){
const email=$('#li-email').value.trim().toLowerCase(),pass=$('#li-pass').value;
if(!email||!pass)return toast('Enter email and password','warning');
try{
const acc=(await db.ref('accounts/'+emailKey(email)).once('value')).val();
if(!acc)return toast('No account found','error');
if(acc.pass!==hashPass(pass))return toast('Wrong password','error');
let u=(await db.ref('users/'+acc.uid).once('value')).val()||{name:acc.name,email:acc.email,avatar:AVATAR_PRESETS[0],xp:0};
localStorage.setItem('basiler_session',JSON.stringify({email,uid:acc.uid}));
startApp({uid:acc.uid,...u});
toast('Welcome back, '+u.name+'! 👋','success');
}catch(e){console.error(e);toast('Sign in failed','error');}}

}<div class="flex justify-between text-[11.5px] text-white/40 font-semibold"><span>🗳 ${fmt(total)}</span>${ended?'<span>🏆 '+esc(opts[lead]?opts[lead].label:'Tie')+'</span>':`<span class="tl" data-end="${b.endsAt}">${timeLeft(b.endsAt)}</span>`}</div></div>`;}

function pageDiscover(){const live=Object.entries(allBattles).filter(([,b])=>Date.now()<=(b.endsAt||0));let list=live.filter(([,b])=>(discCat==='all'||b.category===discCat)&&(!searchQ||(b.title||'').toLowerCase().includes(searchQ)));list.sort((a,b)=>votesOf(b[1])-votesOf(a[1]));return `<div class="fade-up"><h2 class="font-display font-extrabold text-2xl mb-1">Discover</h2><p class="text-white/45 text-sm mb-5">Search battles & filter by category.</p><div class="glass rounded-2xl p-3 flex items-center gap-2 mb-4"><i data-lucide="search" class="w-4 h-4 text-white/30"></i><input class="bg-transparent border-none flex-1 text-white text-sm" placeholder="Search battles..." value="${esc(searchQ)}" oninput="searchQ=this.value;render()"></div><div class="flex gap-2 flex-wrap mb-5"><button class="a-tab ${discCat==='all'?'active':''}" onclick="discCat='all';render()">All</button>${CATEGORIES.map(c=>`<button class="a-tab ${discCat===c.id?'active':''}" onclick="discCat='${c.id}';render()">${c.name}</button>`).join('')}</div><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${list.map(([id,b])=>battleCard(b,id)).join('')}</div></div>`;}

function pageBattle(){const b=allBattles[viewParam];if(!b)return emptyState('search-x','Battle not found — it may have ended');const cat=catOf(b.category),total=votesOf(b),ended=Date.now()>(b.endsAt||0);const myVote=(b.options||[]).findIndex(o=>(o.votes||{})[MY.uid]);const creator=allUsers[b.creator];const counts=(b.options||[]).map(o=>Object.keys(o.votes||{}).length);let winner='Tie';if(total>0){const mx=Math.max(...counts);if(counts.filter(c=>c===mx).length===1)winner=b.options[counts.indexOf(mx)].label;}const link=battleLink(viewParam);return `<div class="max-w-4xl mx-auto fade-up"><button class="btn-ghost rounded-xl px-4 py-2 text-sm font-bold mb-5" onclick="navTo('home')">← Back</button>${ended?`<div class="glass-strong rounded-2xl p-4 mb-5 text-center" style="border-color:rgba(251,191,36,.35)"><div class="text-[11px] uppercase tracking-widest text-white/40 font-bold mb-1">🏆 Winner</div><div class="font-display font-extrabold text-2xl golden-quote">${esc(winner)}</div></div>`:''}<div class="glass-strong rounded-3xl p-6 md:p-8"><div class="flex items-center gap-2 flex-wrap mb-4 justify-center"><span class="badge" style="color:${cat.color};border-color:${cat.color}44"><i data-lucide="${cat.icon}" class="w-3.5 h-3.5"></i>${cat.name}</span>${ended?'<span class="badge" style="color:#F43F5E">Ended</span>':'<span class="badge" style="color:#10B981"><span class="live-dot"></span>Live</span>'}<span class="badge">🗳 ${fmt(total)} votes</span>${!ended?`<span class="badge tl" style="color:#FBBF24" data-end="${b.endsAt}">${timeLeft(b.endsAt)}</span>`:''}</div><h1 class="font-display font-extrabold text-2xl md:text-3xl leading-tight mb-2 text-center">${esc(b.title)}</h1>${!ended?'<div class="text-center text-[12px] text-white/35 mb-6">💡 Vote change kar sakte hain — expire tak</div>':'<div style="height:12px"></div>'}<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${(b.options||[]).map((o,i)=>{const c=counts[i],pct=total?Math.round(c/total*100):0;return `<div class="option-tile ${myVote===i?'voted':''} ${ended?'ended':''} glass rounded-2xl p-4" onclick="vote('${viewParam}',${i})"><div class="absolute inset-y-0 left-0 gradient-brand opacity-20" style="width:${pct}%;transition:width .5s"></div>${o.img?`<img src="${o.img}" class="relative w-full aspect-[16/10] object-cover rounded-2xl mb-3" style="box-shadow:0 12px 40px -12px rgba(0,0,0,.6)">`:''}<div class="relative flex items-center justify-between gap-3"><div class="font-bold text-[16px]">${esc(o.label)}</div><div class="text-right"><div class="font-display font-extrabold text-xl">${pct}%</div><div class="text-[10.5px] text-white/40">${fmt(c)} votes</div></div></div>${myVote===i?'<div class="relative mt-2 text-[11px] font-bold text-indigo-400">✓ Your vote — tap other to change</div>':(!ended&&myVote>=0?'<div class="relative mt-2 text-[10.5px] text-white/30">tap to switch vote</div>':'')}</div>`;}).join('')}</div>${creator?`<div class="flex items-center gap-2 mt-6 text-[12px] text-white/40 justify-center flex-wrap">Created by <img src="${creator.avatar||AVATAR_PRESETS[0]}" class="w-6 h-6 rounded-full cursor-pointer" onclick="openUser('${b.creator}')"> <b class="text-white/70 cursor-pointer" onclick="openUser('${b.creator}')">${esc(creator.name)}</b> ${uidChip(b.creator)} · ${fmtDate(b.createdAt)}</div>`:''}</div><div class="glass rounded-2xl p-5 mt-4"><div class="flex items-center gap-2 mb-3"><i data-lucide="link" class="w-4 h-4 text-cyan-300"></i><b class="font-display text-[15px]">Auto Share Link</b><span class="badge" style="color:#10B981">auto-generated</span></div><div class="flex gap-2 flex-wrap items-center"><input readonly value="${esc(link)}" class="input-field flex-1" style="font-size:12px;padding:10px 12px;color:#67E8F9"><button class="a-btn" onclick="copyBattleLink('${viewParam}')"><i data-lucide="copy" class="w-3.5 h-3.5 inline"></i> Copy</button></div><div class="flex gap-2 mt-3 flex-wrap"><button class="a-btn" style="background:rgba(37,211,102,.15);border-color:rgba(37,211,102,.4);color:#4ADE80" onclick="shareBattleWA('${viewParam}')">${waIcon(15)} WhatsApp</button><button class="a-btn" onclick="shareBattleNative('${viewParam}')"><i data-lucide="share-2" class="w-3.5 h-3.5 inline"></i> More apps</button><button class="a-btn" onclick="copyBattleLink('${viewParam}')"><i data-lucide="copy" class="w-3.5 h-3.5 inline"></i> Copy link</button></div></div><div class="glass rounded-3xl p-6 mt-6"><div class="flex items-center gap-2 mb-4"><i data-lucide="message-circle" class="w-5 h-5 text-indigo-400"></i><b class="font-display">Comments</b><span class="badge" id="cmt-count">${battleComments.length}</span></div><div id="cmt-list" class="space-y-3 mb-4" style="max-height:384px;overflow-y:auto">${commentsHTML()}</div><div class="flex gap-2"><img src="${MY.avatar||AVATAR_PRESETS[0]}" class="w-9 h-9 rounded-full object-cover"><input id="cmt-inp" class="input-field flex-1" maxlength="300" placeholder="Add a comment..." onkeydown="if(event.key==='Enter')postComment()"><button class="btn-primary rounded-xl px-4 font-bold text-sm" onclick="postComment()">Post</button></div></div></div>`;}
function copyBattleLink(id){navigator.clipboard.writeText(battleLink(id)).then(()=>toast('Battle link copied! 🔗','success')).catch(()=>toast('Could not copy','error'));}
function shareBattleWA(id){const b=allBattles[id];if(!b)return;const txt='⚔ '+b.title+'\n🗳 Vote now on '+SETTINGS.name+'!\n'+battleLink(id);window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');}
function shareBattleNative(id){const b=allBattles[id];if(!b)return;const txt='⚔ '+b.title+' — Vote now on '+SETTINGS.name+'! '+battleLink(id);if(navigator.share){navigator.share({title:b.title,text:txt}).catch(()=>{});}else copyBattleLink(id);}
function commentsHTML(){if(!battleComments.length)return '<div class="text-center text-white/30 text-sm py-6">No comments yet — be the first!</div>';return battleComments.map(c=>`<div class="flex gap-2.5 fade-up"><img src="${c.avatar||AVATAR_PRESETS[0]}" class="w-8 h-8 rounded-full object-cover cursor-pointer flex-shrink-0 mt-0.5" onclick="openUserModal('${c.uid}')"><div class="glass rounded-xl px-3 py-2 flex-1 min-w-0"><div class="flex items-center gap-2 mb-0.5 flex-wrap"><b class="text-[12.5px] cursor-pointer" style="color:${colorFor(c.uid)}" onclick="openUserModal('${c.uid}')">${esc(c.name)}</b><span class="text-[9.5px] text-cyan-300 font-bold">${userCode(c.uid)}</span><span class="text-[10.5px] text-white/30">${fmtTime(c.ts)}</span>${c.uid===MY.uid?`<button class="ml-auto text-white/25 hover:text-red-400" onclick="delComment('${c.id}')"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>`:''}</div><div class="text-[13.5px] text-white/85 whitespace-pre-wrap">${esc(c.text)}</div></div></div>`).join('');}
function attachComments(bid){detachComments();battleListenId=bid;battleComments=[];onComments=db.ref('comments/'+bid).on('value',s=>{battleComments=Object.entries(s.val()||{}).map(([k,v])=>({id:k,...v})).sort((a,b)=>(a.ts||0)-(b.ts||0));const el=$('#cmt-list');if(el)el.innerHTML=commentsHTML();const cc=$('#cmt-count');if(cc)cc.textContent=battleComments.length;lucide.createIcons();},showFirebaseError);}
function detachComments(){if(onComments&&battleListenId){try{db.ref('comments/'+battleListenId).off('value',onComments);}catch(e){}}onComments=null;battleListenId=null;battleComments=[];}
async function postComment(){const t=$('#cmt-inp').value.trim();if(!t)return;if(bannedUsers.has(MY.uid))return toast('You are banned','error');await db.ref('comments/'+battleListenId).push({uid:MY.uid,name:MY.name,avatar:MY.avatar,text:t,ts:Date.now()});$('#cmt-inp').value='';const b=allBattles[battleListenId];if(b&&b.creator&&b.creator!==MY.uid)pushNotif(b.creator,'comment',`${MY.name} commented on "${b.title}"`,{bid:battleListenId});}
async function delComment(id){if(!confirm('Delete this comment?'))return;await db.ref('comments/'+battleListenId+'/'+id).remove();toast('Comment deleted','info');}

async function vote(bid,oi){const b=allBattles[bid];if(!b)return;if(Date.now()>(b.endsAt||0))return toast('Battle has ended — voting closed','warning');if(bannedUsers.has(MY.uid))return toast('You are banned','error');const prevVote=(b.options||[]).findIndex(o=>(o.votes||{})[MY.uid]);if(prevVote===oi)return toast('You already voted this option','warning');const updates={};if(prevVote>=0){updates['battles/'+bid+'/options/'+prevVote+'/votes/'+MY.uid]=null;}else{const today=new Date().toDateString(),last=MY.lastVoteDay||'';let streak=MY.streakDays||0;if(last!==today){const y=new Date(Date.now()-864e5).toDateString();streak=(last===y)?streak+1:1;}const old=MY.xp||0;updates['users/'+MY.uid+'/xp']=old+20;updates['users/'+MY.uid+'/votesCount']=(MY.votesCount||0)+1;updates['users/'+MY.uid+'/streakDays']=streak;updates['users/'+MY.uid+'/lastVoteDay']=today;if(b.creator&&b.creator!==MY.uid)pushNotif(b.creator,'vote',`${MY.name} voted on your battle "${b.title}"`,{bid});checkLevelUp(old,old+20);beep();}updates['battles/'+bid+'/options/'+oi+'/votes/'+MY.uid]=Date.now();await db.ref().update(updates);if(prevVote>=0)toast('Vote changed! ✅','success');else toast('+20 XP earned! ⚡','success');}
async function claimBonus(){const today=new Date().toDateString();if(MY.lastBonus===today)return toast('Already claimed today!','warning');const old=MY.xp||0;await db.ref('users/'+MY.uid).update({xp:old+50,lastBonus:today});toast('+50 XP claimed! 🎁','success');fireConfetti();beep();checkLevelUp(old,old+50);}

function pageCreate(){return `<div class="max-w-2xl mx-auto fade-up"><h2 class="font-display font-extrabold text-2xl mb-1">Create a Battle ⚔</h2><p class="text-white/45 text-sm mb-6">Left vs Right · dono pictures zaroori hain 🖼</p><div class="glass-strong rounded-3xl p-6" style="position:relative;overflow:visible"><div style="position:absolute;right:-30px;top:-30px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.22),transparent 70%);pointer-events:none"></div><label class="lbl">Battle Title</label><input id="cr-title" class="input-field" maxlength="90" placeholder="e.g. Android vs iPhone — which is better?"><label class="lbl">Category</label><div class="flex gap-2 flex-wrap">${CATEGORIES.map(c=>`<button class="a-tab ${createCat===c.id?'active':''}" onclick="createCat='${c.id}';render()">${c.name}</button>`).join('')}</div><label class="lbl">Options + Pictures</label><div class="vs-wrap"><div class="grid grid-cols-2 gap-3"><div><div class="text-center text-[11px] font-bold uppercase tracking-wider text-indigo-400 mb-2">⬅ Option A</div><input class="input-field" maxlength="40" placeholder="Left option" value="${esc(createOpts[0].label)}" oninput="createOpts[0].label=this.value" style="margin-bottom:8px"><label class="upload-box" id="cr-img0">${createOpts[0].img?`<img src="${createOpts[0].img}">`:`🖼<span style="margin-top:4px">Select picture</span>`}<input type="file" accept="image/*" hidden onchange="pickOptImg(0,this)"></label></div><div><div class="text-center text-[11px] font-bold uppercase tracking-wider text-purple-400 mb-2">Option B ➡</div><input class="input-field" maxlength="40" placeholder="Right option" value="${esc(createOpts[1].label)}" oninput="createOpts[1].label=this.value" style="margin-bottom:8px"><label class="upload-box" id="cr-img1">${createOpts[1].img?`<img src="${createOpts[1].img}">`:`🖼<span style="margin-top:4px">Select picture</span>`}<input type="file" accept="image/*" hidden onchange="pickOptImg(1,this)"></label></div></div><div class="vs-circle">VS</div></div><label class="lbl">Duration</label><div class="flex gap-2 flex-wrap" id="cr-durs">${[['1h',36e5],['6h',216e5],['1d',864e5],['3d',2592e5],['7d',6048e5]].map(([l,ms])=>`<button class="a-tab ${createDur===ms?'active':''}" data-ms="${ms}" onclick="pickDur(this)">${l}</button>`).join('')}</div><div class="glass rounded-xl p-3 mt-4 text-[12px] text-white/50 flex items-center gap-2"><i data-lucide="info" class="w-4 h-4 text-indigo-400 flex-shrink:0"></i>Battle ka auto share link generate hoga — WhatsApp/Insta par bhejein. Users expire tak vote change kar sakte hain.</div><button class="btn-primary w-full rounded-xl py-3.5 font-bold mt-6" onclick="createBattle()">🚀 Launch Battle</button></div></div>`;}
function pickDur(btn){createDur=+btn.dataset.ms;$$('#cr-durs .a-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
async function pickOptImg(i,inp){const f=inp.files[0];if(!f)return;if(f.size>8*1024*1024)return toast('Image too big (max 8MB)','warning');try{createOpts[i].img=await compressImage(f,700,.65);const box=$('#cr-img'+i);if(box)box.innerHTML=`<img src="${createOpts[i].img}"><input type="file" accept="image/*" hidden onchange="pickOptImg(${i},this)">`;toast('Picture added ✅','success');}catch(e){toast('Could not load image','error');}}
async function createBattle(){const title=$('#cr-title').value.trim();const a={label:createOpts[0].label.trim(),img:createOpts[0].img};const b={label:createOpts[1].label.trim(),img:createOpts[1].img};if(title.length<5)return toast('Title too short (min 5 chars)','warning');if(!a.label||!b.label)return toast('Dono options ke naam likhein','warning');if(!a.img)return toast('Option A (left) ki picture select karein 🖼','warning');if(!b.img)return toast('Option B (right) ki picture select karein 🖼','warning');if(bannedUsers.has(MY.uid))return toast('You are banned','error');const ref=await db.ref('battles').push({title,category:createCat,creator:MY.uid,creatorName:MY.name,createdAt:Date.now(),endsAt:Date.now()+createDur,options:[{label:a.label,img:a.img,votes:{}},{label:b.label,img:b.img,votes:{}}]});createOpts=[{label:'',img:''},{label:'',img:''}];createDur=864e5;toast('Battle launched! Link auto-generated 🚀','success');fireConfetti();const url=battleLink(ref.key);if(navigator.share){try{await navigator.share({title,body:'⚔ '+title+' — Vote now! '+url});}catch(e){}}navTo('home');}

function pageLeaderboard(){if(lbView==='results')return pageLBResults();const all=Object.entries(allUsers).filter(([uid])=>!bannedUsers.has(uid));const statsMap={};all.forEach(([uid])=>statsMap[uid]=userStats(uid));const list=all.filter(([uid,u])=>!lbQ||String(u.name).toLowerCase().includes(lbQ.toLowerCase()));list.sort((a,b)=>{const ua=a[1],ub=b[1];if(lbFilter==='xp')return (ub.xp||0)-(ua.xp||0);if(lbFilter==='votes')return (ub.votesCount||0)-(ua.votesCount||0);if(lbFilter==='wins')return statsMap[b[0]].won-statsMap[a[0]].won;if(lbFilter==='battles')return statsMap[b[0]].created-statsMap[a[0]].created;return 0;});const t3=list.slice(0,3),rest=list.slice(3);const medals=['🥇','🥈','🥉'];const podColors=['#FCD34D','#CBD5E1','#D97706'];const myRank=list.findIndex(([uid])=>uid===MY.uid)+1;const podium=[1,0,2].map(idx=>{const [uid,u]=t3[idx]||[null,null];if(!u)return `<div></div>`;return `<div class="podium-card ${idx===0?'first':''}" onclick="openUser('${uid}')">${idx===0?'<div class="crown">👑</div>':''}<img src="${u.avatar||AVATAR_PRESETS[0]}" class="p-av" style="border-color:${podColors[idx]}"><div class="font-bold text-[13.5px] truncate">${esc(u.name)}</div><div class="mt-1">${uidChip(uid)}</div><div class="font-display font-extrabold text-[15px] mt-1" style="color:${podColors[idx]}">${fmt(u.xp||0)} XP</div><div class="text-[10px]">${medals[idx]}</div></div>`;}).join('');return `<div class="max-w-3xl mx-auto fade-up"><h2 class="font-display font-extrabold text-2xl mb-1">🏆 Leaderboard</h2><p class="text-white/45 text-sm mb-5">${all.length} fighters ${myRank?`— you are <b class="text-indigo-400">#${myRank}</b>`:''}</p><div class="flex gap-2 mb-5"><button class="a-tab active">🏅 Ranking</button><button class="a-tab" onclick="lbView='results';render()">📊 Results</button></div>${t3.length?`<div class="grid grid-cols-3 gap-3 mb-6 items-end">${podium}</div>`:''}<div class="glass rounded-2xl p-3 flex items-center gap-2 mb-4"><i data-lucide="search" class="w-4 h-4 text-white/30"></i><input class="bg-transparent border-none flex-1 text-white text-sm" placeholder="Search fighter..." value="${esc(lbQ)}" oninput="lbQ=this.value;render()"></div><div class="flex gap-2 flex-wrap mb-5">${[['xp','⚡ XP'],['votes','🗳 Votes'],['wins','🥇 Wins'],['battles','⚔ Battles']].map(([k,l])=>`<button class="a-tab ${lbFilter===k?'active':''}" onclick="lbFilter='${k}';render()">${l}</button>`).join('')}</div><div class="space-y-2.5">${rest.map(([uid,u],i)=>{const st=statsMap[uid];const rank=i+4;return `<div class="glass card-hover rounded-2xl p-3.5 flex items-center gap-3 flex-wrap"><div class="w-9 text-center font-display font-extrabold text-sm text-white/35">#${rank}</div><img src="${u.avatar||AVATAR_PRESETS[0]}" class="w-11 h-11 rounded-xl object-cover cursor-pointer" onclick="openUser('${uid}')"><div class="min-w-0 flex-1 cursor-pointer" onclick="openUser('${uid}')"><div class="font-bold text-[14.5px] truncate">${esc(u.name)} ${uid===MY.uid?'<span class="badge" style="color:#818CF8">You</span>':''}</div><div class="mt-0.5">${uidChip(uid)}</div><div class="flex gap-1.5 mt-1 flex-wrap"><span class="badge" style="color:#6EE7B7">🗳 ${u.votesCount||0}</span><span class="badge" style="color:#10B981">🥇 ${st.won}</span><span class="badge" style="color:#F43F5E">⚔ ${st.created}</span></div></div><div class="text-right"><div class="font-display font-extrabold text-yellow-300">${fmt(u.xp||0)}</div><div class="text-[9.5px] text-white/35 font-bold">XP</div></div><button class="a-btn" onclick="openUser('${uid}')"><i data-lucide="user" class="w-3.5 h-3.5 inline"></i> Profile</button></div>`;}).join('')}</div></div>`;}
function pageLBResults(){const res=Object.entries(archivedResults).sort((a,b)=>(b[1].endedAt||0)-(a[1].endedAt||0));return `<div class="max-w-3xl mx-auto fade-up"><h2 class="font-display font-extrabold text-2xl mb-1">📊 Battle Results</h2><p class="text-white/45 text-sm mb-5">${res.length} expired battles — winners yahan show hote hain</p><div class="flex gap-2 mb-5"><button class="a-tab" onclick="lbView='rank';render()">🏅 Ranking</button><button class="a-tab active">📊 Results</button></div><div class="space-y-2.5">${res.map(([id,r])=>{const cat=catOf(r.category);const creator=allUsers[r.creator];return `<div class="glass card-hover rounded-2xl p-4"><div class="flex items-center gap-2 flex-wrap mb-2"><span class="badge" style="color:${cat.color};border-color:${cat.color}44"><i data-lucide="${cat.icon}" class="w-3.5 h-3.5"></i>${cat.name}</span><span class="badge" style="color:#F43F5E">Ended</span><span class="badge">${fmtDate(r.endedAt)}</span></div><div class="font-display font-bold text-[15.5px] mb-1">${esc(r.title)}</div><div class="glass rounded-xl p-3 text-center mb-2" style="border-color:rgba(251,191,36,.3)"><div class="text-[10px] uppercase tracking-widest text-white/40 font-bold mb-0.5">🏆 Winner</div><div class="font-display font-extrabold text-lg golden-quote">${esc(r.winner||'Tie')}</div></div><div class="flex items-center justify-between flex-wrap gap-2 text-[12px] text-white/40"><span>🗳 ${fmt(r.total)} total votes</span>${creator?`<span class="flex items-center gap-1.5">by <img src="${creator.avatar||AVATAR_PRESETS[0]}" class="w-5 h-5 rounded-full cursor-pointer" onclick="openUser('${r.creator}')"> <b class="text-white/70 cursor-pointer" onclick="openUser('${r.creator}')">${esc(r.creatorName||creator.name)}</b> ${uidChip(r.creator)}</span>`:(r.creatorName?`<span>by ${esc(r.creatorName)}</span>`:'')}</div></div>`;}).join('')||emptyState('bar-chart-3','No expired battles yet — jab battle expire hoga, result yahan aa jayega')}</div></div>`;}

const games=[{id:'snake',name:'Snake',ic:'worm',color:'#10B981'},{id:'tetris',name:'Tetris',ic:'grid-2x2',color:'#6366F1'},{id:'pong',name:'Pong',ic:'circle',color:'#EC4899'}].filter(g=>g.name.toLowerCase().includes(gameSearchQ.toLowerCase()));
return `<div class="fade-up">

let snakeState={canvas:null,ctx:null,snake:[],food:{},dir:'right',score:0,loop:null};

<div class="text-center text-white/60 text-xs mb-2">Use Arrow Keys ⬆️⬇️⬅️➡️</div>
<canvas id="snakeCanvas" width="400" height="400" style="background:#05060D;border:2px solid rgba(16,185,129,.3);border-radius:12px;width:100%;height:auto"></canvas>
<div class="flex justify-between items-center mt-4">
<div class="text-sm">Score: <b id="snakeScore" class="text-emerald-400">0</b> | High: <b class="text-yellow-400">${MY.gameStats?.snake?.highScore||0}</b></div>
<button class="btn-primary rounded-xl py-2 px-4 font-bold text-sm" onclick="startSnake()">Start Game</button>
</div>
<h4 class="font-display font-bold text-sm mt-5 mb-2">🏆 Top 50 Leaderboard</h4>
<div id="snakeLeaderboard" class="space-y-1 max-h-[150px] overflow-y-auto pr-1">Loading...</div>
</div></div>`;
lucide.createIcons();
renderSnakeLeaderboard();
}
function closeSnakeGame(){clearInterval(snakeState.loop);$('#modal-root').innerHTML='';}
function startSnake(){
clearInterval(snakeState.loop);
snakeState.canvas=$('#snakeCanvas');snakeState.ctx=snakeState.canvas.getContext('2d');
snakeState.snake=[{x:10,y:10}];snakeState.dir='right';snakeState.score=0;
 $('#snakeScore').textContent='0';
spawnFood();
document.addEventListener('keydown',changeSnakeDir);
snakeState.loop=setInterval(updateSnake,100);
}
function spawnFood(){snakeState.food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};}
function changeSnakeDir(e){
if(e.key==='ArrowUp'&&snakeState.dir!='down')snakeState.dir='up';
if(e.key==='ArrowDown'&&snakeState.dir!='up')snakeState.dir='down';
if(e.key==='ArrowLeft'&&snakeState.dir!='right')snakeState.dir='left';
if(e.key==='ArrowRight'&&snakeState.dir!='left')snakeState.dir='right';
}
function updateSnake(){
const head={...snakeState.snake[0]};
if(snakeState.dir=='up')head.y--;if(snakeState.dir=='down')head.y++;if(snakeState.dir=='left')head.x--;if(snakeState.dir=='right')head.x++;
if(head.x<0||head.x>19||head.y<0||head.y>19||snakeState.snake.some(s=>s.x==head.x&&s.y==head.y))return endSnakeGame();
snakeState.snake.unshift(head);
if(head.x==snakeState.food.x&&head.y==snakeState.food.y){snakeState.score+=1;$('#snakeScore').textContent=snakeState.score;spawnFood();}else{snakeState.snake.pop();}
drawSnake();
}
function drawSnake(){
const c=snakeState.ctx;c.fillStyle='#05060D';c.fillRect(0,0,400,400);
c.fillStyle='#10B981';snakeState.snake.forEach(s=>c.fillRect(s.x*20,s.y*20,18,18));
c.fillStyle='#F43F5E';c.fillRect(snakeState.food.x*20,snakeState.food.y*20,18,18);
}
async function endSnakeGame(){
clearInterval(snakeState.loop);
document.removeEventListener('keydown',changeSnakeDir);
const score=snakeState.score*10;
const oldHigh=MY.gameStats?.snake?.highScore||0;
if(score>oldHigh){
const xpEarned=score; // 10 score = 100 XP
const oldXP=MY.xp||0;
await db.ref('users/'+MY.uid+'/gameStats/snake').update({highScore:score,playedCount:(MY.gameStats?.snake?.playedCount||0)+1,recordCount:(MY.gameStats?.snake?.recordCount||0)+1,lastPlayed:Date.now()});
await db.ref('users/'+MY.uid).update({xp:oldXP+xpEarned});
await db.ref('games/scores/snake/'+MY.uid).set({name:MY.name,avatar:MY.avatar,score:score,ts:Date.now()});
toast('New High Score! +'+xpEarned+' XP','success');fireConfetti();
checkLevelUp(oldXP,oldXP+xpEarned);
}else{
await db.ref('users/'+MY.uid+'/gameStats/snake').update({playedCount:(MY.gameStats?.snake?.playedCount||0)+1,lastPlayed:Date.now()});
toast('Game Over! Score: '+score,'info');
}
renderSnakeLeaderboard();
if(view==='profile')render();
}
async function renderSnakeLeaderboard(){
const el=$('#snakeLeaderboard');if(!el)return;
const snap=await db.ref('games/scores/snake').orderByChild('score').limitToLast(50).once('value');
const scores=Object.values(snap.val()||{}).sort((a,b)=>b.score-a.score);
if(!scores.length){el.innerHTML='<div class="text-white/30 text-xs text-center py-4">No scores yet. Be the first!</div>';return;}
el.innerHTML=scores.map((s,i)=>`<div class="flex items-center gap-2 p-2 rounded-lg ${s.name===MY.name?'bg-indigo-500/20 border border-indigo-500/30':'bg-white/5'}">

<img src="${s.avatar||AVATAR_PRESETS[0]}" class="w-6 h-6 rounded-full">
<div class="flex-1 text-xs font-bold truncate">${esc(s.name)}</div>
<div class="text-xs font-bold text-emerald-400">${s.score}</div>
</div>`).join('');
}

function toggleSound(){soundOn=!soundOn;localStorage.setItem('basiler_sound',soundOn?'on':'off');if(chatSettingsOpen)renderChatSettings();const btn=document.querySelector('.desktop-sidebar [onclick="toggleSound()"]');if(btn)btn.innerHTML=`<i data-lucide="${soundOn?'volume-2':'volume-x'}" class="w-4 h-4"></i>`;lucide.createIcons();}
function cycleAppTheme(){SETTINGS.theme=(SETTINGS.theme+1)%THEMES.length;localStorage.setItem('basiler_theme',SETTINGS.theme);applySettings(SETTINGS);toast('Theme: '+THEMES[SETTINGS.theme].n,'info');}

function openUserModal(uid){const u=allUsers[uid];if(!u)return;$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)document.getElementById('modal-root').innerHTML=''"><div class="modal-card scale-in text-center"><img src="${u.avatar||AVATAR_PRESETS[0]}" class="w-20 h-20 rounded-3xl object-cover mx-auto mb-3"><h3 class="font-display font-extrabold text-xl">${esc(u.name)}</h3><div class="mt-1 mb-2 flex justify-center">${uidChip(uid)}</div><div class="text-[12px] text-white/40 font-semibold mb-3">⚡ Level ${levelOf(u.xp)} · ${isOnline(uid)?'🟢 Online':'⚪ Offline'} · 🕐 ${acctAge(u.createdAt)}</div><div class="flex gap-2 justify-center flex-wrap mb-4"><span class="badge" style="color:#FCD34D">${fmt(u.xp||0)} XP</span><span class="badge" style="color:#6EE7B7">🗳 ${u.votesCount||0}</span></div>${uid!==MY.uid?`<div class="flex gap-2"><button class="btn-primary flex-1 rounded-xl py-2.5 font-bold text-sm" onclick="document.getElementById('modal-root').innerHTML='';startDM('${uid}')">Message</button><button class="btn-ghost flex-1 rounded-xl py-2.5 font-bold text-sm" onclick="document.getElementById('modal-root').innerHTML='';openUser('${uid}')">Full Profile</button></div>`:'<button class="btn-ghost w-full rounded-xl py-2.5 font-bold text-sm" onclick="document.getElementById(\'modal-root\').innerHTML=\'\';navTo(\'profile\')">My Profile</button>'}</div></div>`;lucide.createIcons();}
function viewImg(src){$('#modal-root').innerHTML=`<div class="modal-overlay" style="cursor:zoom-out" onclick="document.getElementById('modal-root').innerHTML=''"><img src="${src}" style="max-width:92vw;max-height:90vh;border-radius:16px"></div>`;}

function openAdmin(){if(isAdmin){adminPage='main';navTo('admin');return;}$('#admin-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)document.getElementById('admin-root').innerHTML=''"><div class="modal-card text-center"><div class="w-14 h-14 rounded-2xl gradient-brand flex items-center justify-center mx-auto mb=4 glow-brand"><i data-lucide="shield" class="w-7 h-7 text-white"></i></div><h3 class="font-display font-extrabold text-xl mb-1">Admin Access</h3><p class="text-white/45 text-sm mb-4">Enter admin password</p><input id="ad-pass" type="password" class="input-field" placeholder="Password" onkeydown="if(event.key==='Enter')adminLogin()"><button class="btn-primary w-full rounded-xl py-3 font-bold mt-3" onclick="adminLogin()">Unlock 🔓</button><button class="btn-ghost w-full rounded-xl py-2.5 font-bold text-sm mt-2" onclick="document.getElementById('admin-root').innerHTML=''">Cancel</button></div></div>`;lucide.createIcons();setTimeout(()=>{const i=$('#ad-pass');if(i)i.focus();},100);}
function adminLogin(){if($('#ad-pass').value!==ADMIN_PASS)return toast('Wrong password','error');isAdmin=true;sessionStorage.setItem('basiler_admin','1');$('#admin-root').innerHTML='';toast('Admin unlocked 🛡','success');adminPage='main';navTo('admin');}
function navAdmin(p){if(p==='privacy'){db.ref('accounts').once('value').then(s=>{adminAccounts=s.val()||{};adminPage=p;render();}).catch(()=>{adminAccounts={};adminPage=p;render();});return;}adminPage=p;render();}
function adminBack(){if(adminPage==='main')navTo('home');else{adminPage='main';render();}}
const adminBackBtn=`<button class="btn-ghost rounded-xl px-4 py-2 text-sm font-bold mb-5" onclick="adminBack()"><i data-lucide="arrow-left" class="w-4 h-4 inline"></i> Back</button>`;
function pageAdmin(){if(adminPage==='users')return pageAdminUsers();if(adminPage==='battles')return pageAdminBattles();if(adminPage==='privacy')return pageAdminPrivacy();if(adminPage==='settings')return pageAdminSettings();const cards=[{p:'users',ic:'users',t:'Users',d:'Ban, unban, gift XP, IDs',c:'#6366F1'},{p:'battles',ic:'swords',t:'Battles',d:'View & delete battles',c:'#A855F7'},{p:'privacy',ic:'lock',t:'🔒 Privacy',d:'All accounts — name, email, password',c:'#FBBF24'},{p:'settings',ic:'settings',t:'Settings',d:'Names, backgrounds, themes',c:'#10B981'}];return `<div class="max-w-2xl mx-auto fade-up"><button class="btn-ghost rounded-xl px-4 py-2 text-sm font-bold mb-5" onclick="navTo('home')"><i data-lucide="arrow-left" class="w-4 h-4 inline"></i> Home</button><h2 class="font-display font-extrabold text-2xl mb-1">🛡 Admin Panel</h2><p class="text-white/45 text-sm mb-6">Tap a category to open its screen</p><div class="grid md:grid-cols-2 gap-4">${cards.map(c=>`<div class="glass card-hover rounded-2xl p-5 cursor-pointer" onclick="navAdmin('${c.p}')"><div class="w-11 h-11 rounded-xl flex items-center justify-center mb-3" style="background:${c.c}22;border:1px solid ${c.c}55;color:${c.c}"><i data-lucide="${c.ic}" class="w-5 h-5"></i></div><div class="font-display font-bold text-[16px] mb-1">${c.t}</div><div class="text-[12.5px] text-white/45">${c.d}</div></div>`).join('')}</div></div>`;}
function pageAdminUsers(){const users=Object.entries(allUsers);return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">👤 Users</h2><p class="text-white/45 text-sm mb-6">${users.length} users · ${bannedUsers.size} banned</p>${users.map(([uid,u])=>`<div class="a-row"><img src="${u.avatar||AVATAR_PRESETS[0]}" class="w-9 h-9 rounded-lg object-cover"><div class="flex-1 min-w-[120px]"><b class="text-[13.5px]">${esc(u.name)}</b> ${uidChip(uid)}<div class="text-[10.5px] text-white/40">LVL ${levelOf(u.xp)} · ${fmt(u.xp||0)} XP · ${acctAge(u.createdAt)}</div></div><span class="badge" style="color:${isOnline(uid)?'#10B981':'#8A8DA3'}">${isOnline(uid)?'online':'offline'}</span>${bannedUsers.has(uid)?`<button class="a-btn" onclick="adminUnban('${uid}')">Unban</button>`:`<button class="a-btn danger" onclick="adminBan('${uid}')">Ban</button>`}<button class="a-btn gift" onclick="adminGift('${uid}')">Gift XP</button></div>`).join('')||emptyState('users','No users')}</div>`;}
function pageAdminBattles(){const bl=Object.entries(allBattles);return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">⚔ Battles</h2><p class="text-white/45 text-sm mb-6">${bl.length} active battles</p>${bl.map(([id,b])=>`<div class="a-row"><span class="badge" style="color:${catOf(b.category).color}">${catOf(b.category).name}</span><div class="flex-1 min-w-[150px]"><b class="text-[13px]">${esc(b.title)}</b><div class="text-[10.5px" text-white/40">${fmt(votesOf(b))} votes · ends ${fmtDate(b.endsAt)} · by ${esc(b.creatorName||'?')}</div></div><button class="a-btn" onclick="openBattle('${id}')">View</button><button class="a-btn danger" onclick="adminDelBattle('${id}')">Delete</button></div>`).join('')||emptyState('swords','No battles')}</div>`;}
function pageAdminPrivacy(){const accs = Object.values(adminAccounts || {}).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">🔒 Privacy & Accounts</h2><p class="text-white/45 text-sm mb-2">All accounts — sorted by creation date (Newest first)</p><div class="glass rounded-xl p-3 mb-4 text-[12px] text-white/55 flex items-center gap-2"><i data-lucide="eye" class="w-4 h-4 text-yellow-400"></i> Total accounts: ${accs.length}</div>${accs.map(a=>{const key=emailKey(a.email); return `<div class="a-row"><img src="${(allUsers[a.uid]||{}).avatar||AVATAR_PRESETS[0]}" class="w-10 h-10 rounded-lg object-cover"><div class="flex-1 min-w-[220px]"><div class="text-[14px] font-bold">👤 ${esc(a.name)} <span class="text-[10px] text-cyan-300 font-bold">${userCode(a.uid)}</span></div><div class="text-[12px] text-white/60">📧 ${esc(a.email)}</div><div class="text-[12px] font-bold" style="color:#FCD34D">🔑 ${esc(decPass(a.pw))}</div><div class="text-[10px] text-white/30 mt-1">📅 ${fmtDate(a.createdAt)}</div></div><button class="a-btn danger" onclick="adminDeleteAcc('${a.uid}', '${key}')">Delete Account</button></div>`;}).join('')||emptyState('lock','No accounts found')}</div>`;}
function pageAdminSettings(){return `<div class="max-w-2xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">⚙ Settings & Themes</h2><p class="text-white/45 text-sm mb-6">Names, backgrounds, custom themes, and toggles</p><div class="glass-strong rounded-3xl p-6"><label class="lbl">Website Name</label><div class="flex gap-2 mb-3"><input id="ad-name" class="input-field" maxlength="20" value="${esc(SETTINGS.name)}"><button class="a-btn" onclick="adminSaveName()">Save</button></div><label class="lbl">Chatter App Name</label><div class="flex gap-2 mb-3"><input id="ad-cname" class="input-field" maxlength="20" value="${esc(SETTINGS.chatName)}"><button class="a-btn" onclick="adminSaveChatName()">Save</button></div><label class="lbl">Generate Custom Background (CSS)</label><textarea id="ad-custom-bg" class="input-field" rows="3" placeholder="e.g. linear-gradient(to right, #ee7752, #e73c7e) or #hexcolor"></textarea><button class="a-btn mt-2 mb-5" onclick="adminSaveCustomBg()">Save & Apply Custom BG</button><label class="lbl">Pre-built Themes & Particle Backgrounds</label><div class="grid grid-cols-3 md:grid-cols-5 gap-2 mb-5 max-h-[300px] overflow-y-auto">${THEMES.map((t,i)=>`<div class="theme-sw ${SETTINGS.theme===i?'sel':''}" style="background:${t.bg||'radial-gradient(circle at 30% 30%,#312e81,#06070D)'}" onclick="adminSetTheme(${i})"><span>${t.n}</span></div>`).join('')}</div><label class="lbl">Toggles</label><div class="a-row"><span class="flex-1 text-[13px]">Lock ${esc(SETTINGS.chatName)}</span><button class="a-btn" onclick="adminToggle('chatLocked')">${SETTINGS.chatLocked?'ON 🔒':'OFF 🔓'}</button></div><div class="a-row"><span class="flex-1 text-[13px]">Clear ALL chats</span><button class="a-btn danger" onclick="clearChatNow()">Clear</button></div></div></div>`;}

async function adminBan(uid){await db.ref('meta/banned/'+uid).set(true);toast('User banned','success');}
async function adminUnban(uid){await db.ref('meta/banned/'+uid).remove();toast('User unbanned','info');}
async function adminGift(uid) {
    const amtStr = prompt(`Enter custom XP amount to gift:`);
    const amt = parseInt(amtStr, 10);
    if (isNaN(amt) || amt === 0) return toast('Invalid amount', 'warning');
    const u = allUsers[uid];
    if (!u) return;
    const oldXP = u.xp || 0;
    const newXP = oldXP + amt;
    await db.ref('users/' + uid).update({ xp: newXP });
    toast(`${amt} XP gifted successfully!`, 'success');
}
async function adminDeleteAcc(uid, key) {
    if(!confirm('PERMANENTLY DELETE this account and all related data?')) return;
    await db.ref('accounts/' + key).remove();
    await db.ref('users/' + uid).remove();
    await db.ref('presence/' + uid).remove();
    await db.ref('dms/' + uid).remove();
    await db.ref('notifs/' + uid).remove();
    db.ref('battles').orderByChild('creator').equalTo(uid).once('value', s => {
        s.forEach(child => { child.ref.remove(); });
    });
    adminAccounts = Object.fromEntries(Object.entries(adminAccounts).filter(([k]) => k !== key));
    render();
    toast('Account permanently deleted', 'error');
}
async function adminSaveCustomBg() {
    const bg = $('#ad-custom-bg').value.trim();
    if(!bg) return toast('Enter valid CSS', 'warning');
    await db.ref('meta/settings/theme').set(-1);
    await db.ref('meta/settings/customBg').set(bg);
    SETTINGS.customBg = bg;
    SETTINGS.theme = -1;
    applySettings(SETTINGS);
    toast('Custom background applied!', 'success');
}
async function adminDelBattle(id){if(!confirm('Delete this battle?'))return;await db.ref('battles/'+id).remove();await db.ref('comments/'+id).remove();toast('Battle deleted','info');}
async function adminSaveName(){const n=$('#ad-name').value.trim();if(!n)return;await db.ref('meta/settings/name').set(n);SETTINGS.name=n;toast('Website name saved','success');render();}
async function adminSaveChatName(){const n=$('#ad-cname').value.trim();if(!n)return;await db.ref('meta/settings/chatName').set(n);SETTINGS.chatName=n;toast('Chatter name saved','success');render();}
async function adminSetTheme(i){await db.ref('meta/settings/theme').set(i);await db.ref('meta/settings/customBg').remove();SETTINGS.theme=i;localStorage.setItem('basiler_theme',i);applySettings(SETTINGS);toast('Website theme: '+THEMES[i].n,'success');render();}
async function adminToggle(k){const v=!SETTINGS[k];await db.ref('meta/settings/'+k).set(v);SETTINGS[k]=v;toast(k+' → '+(v?'ON':'OFF'),'info');render();}

async function createDefaultBattles() {
    const snap = await db.ref('battles').once('value');
    const battles = snap.val() || {};
    const titles = Object.values(battles).map(b => b.title);

    const defaults = [
        {
            title: 'Messi vs Ronaldo — Who is the GOAT?',
            category: 'sports',
            options: [
                { label: 'Lionel Messi', img: 'https://upload.wikimedia.org/wikipedia/commons/b/b4/Lionel-Messi-Argentina-2022-FIFA-World-Cup_%28cropped%29.jpg', votes: {} },
                { label: 'Cristiano Ronaldo', img: 'https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg', votes: {} }
            ]
        },
        {
            title: 'Elon Musk vs Bill Gates — Tech Visionary?',
            category: 'tech',
            options: [
                { label: 'Elon Musk', img: 'https://upload.wikimedia.org/wikipedia/commons/e/ed/Elon_Musk_Royal_Society_%28crop2%29.jpg', votes: {} },
                { label: 'Bill Gates', img: 'https://upload.wikimedia.org/wikipedia/commons/a/a8/Bill_Gates_2017_%28cropped%29.jpg', votes: {} }
            ]
        },
        {
            title: 'Google vs Microsoft Edge — Best Browser?',
            category: 'tech',
            options: [
                { label: 'Google Chrome', img: 'https://upload.wikimedia.org/wikipedia/commons/a/a5/Google_Chrome_icon_%28September_2014%29.svg', votes: {} },
                { label: 'Microsoft Edge', img: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Microsoft_Edge_logo_%282019%29.svg', votes: {} }
            ]
        }
    ];

    for (const def of defaults) {
        if (!titles.includes(def.title)) {
            await db.ref('battles').push({
                ...def,
                creator: 'system',
                creatorName: 'Basil-er Bot',
                createdAt: Date.now(),
                endsAt: Date.now() + 86400000 * 7
            });
        }
    }
}

(async()=>{
document.documentElement.style.setProperty('--bubble',bubbleColor);
lucide.createIcons();
try{const s=(await db.ref('meta/settings').once('value')).val()||{};SETTINGS={...SETTINGS,...s};applySettings(s);}catch(e){}

createDefaultBattles();

const h=location.hash.match(/#battle=(.+)/);
if(h){view='battle';viewParam=h[1];}
const sess=JSON.parse(localStorage.getItem('basiler_session')||'null');
if(sess&&sess.uid){try{const u=(await db.ref('users/'+sess.uid).once('value')).val();if(u){startApp({uid:sess.uid,...u});return;}}catch(e){}}
showAuth();})();
</script>
</body>
